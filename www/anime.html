<!DOCTYPE html>
<html lang=zh>
<head>
<meta charset=utf-8>
<title>番剧库</title>
<script src=/lib/artplayer.js></script>
<script src=/lib/artplayer-plugin-danmuku.js></script>
<script>if(window.self===window.top)location.replace('/hub.html?v=anime');</script>
<meta name=viewport content='width=device-width,initial-scale=1'>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{color:#e6edf3;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:#24292e;min-height:100vh}
.crumb{max-width:1600px;margin:14px auto 0;padding:0 20px;display:flex;align-items:center;gap:2px;flex-wrap:wrap;font-size:14px}
.crumb .cb{color:#58a6ff;text-decoration:none;padding:4px 7px;border-radius:6px;cursor:pointer;border:none;background:none;font-size:14px}
.crumb .cb:hover{background:#e3edfb}
.crumb .sep{color:#b0b8c4;padding:0 2px}
.crumb .cur{color:#e6edf3;font-weight:600;padding:4px 7px}
.wrap{max-width:1600px;margin:0 auto;padding:14px 20px 40px}
.back-btn{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:6px 16px;font-size:13px;color:#c9d1d9;cursor:pointer;margin-bottom:10px;transition:all .15s}
.back-btn:hover{background:rgba(255,255,255,.12);color:#e6edf3}
.ep-row{display:flex;align-items:center;gap:10px;background:#2d333b;border-radius:10px;padding:10px 14px;margin-bottom:8px;box-shadow:0 1px 3px rgba(0,0,0,.06);flex-wrap:wrap}
.ep-row .epl{font-size:12px;color:#58a6ff;background:rgba(88,166,255,.15);border-radius:6px;padding:2px 8px;white-space:nowrap}
.ep-row .emn{flex:1;min-width:0;font-size:13px;color:#e6edf3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ep-row .esz{font-size:12px;color:#8b949e;white-space:nowrap}
.ep-row .ops{display:flex;gap:6px;flex-shrink:0;margin-left:auto}
.list{background:#2d333b;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.07);overflow:hidden}
.anime-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px;padding:4px 2px}
.acard{background:#2d333b;border-radius:12px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.08);cursor:pointer;transition:transform .15s,box-shadow .15s}
.acard:hover{transform:translateY(-3px);box-shadow:0 6px 16px rgba(0,0,0,.12)}
.aposter{aspect-ratio:3/4;background:#30363d;position:relative}
.aposter img{width:100%;height:100%;object-fit:cover;display:block}
.aposter .tags{position:absolute;top:6px;left:6px;display:flex;flex-direction:column;align-items:flex-start;gap:3px;pointer-events:none;z-index:2}
.aposter .tags span{background:rgba(0,0,0,.6);color:#fff;font-size:10px;padding:1px 7px;border-radius:999px}
.aposter .ms{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.6);color:#ffd54f;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;pointer-events:none;z-index:2}
.aposter .me{position:absolute;bottom:6px;left:6px;background:rgba(0,0,0,.55);color:#fff;font-size:11px;padding:2px 7px;border-radius:999px;pointer-events:none;z-index:2}
.aph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:30px;color:#b6c0cc}
.atitle{font-size:12.5px;color:#e6edf3;padding:8px 10px 2px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.7em}
@media (max-width:640px){.anime-grid{grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:10px}}
.row{display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid #f2f2f2;cursor:pointer;flex-wrap:wrap}
.row:last-child{border-bottom:none}
.row:hover{background:#343b44}
.row .ic{width:24px;text-align:center;font-size:16px;flex-shrink:0}
.row .nm{flex:1;min-width:0;font-size:13.5px;color:#e6edf3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .cnt{font-size:11.5px;color:#8b949e;background:#f1f3f6;border-radius:999px;padding:2px 9px;white-space:nowrap}
.row .sz{font-size:12px;color:#8b949e;width:82px;text-align:right;white-space:nowrap}
.row .ops{display:flex;gap:6px;flex-shrink:0}
/* 手机窄屏:名称完整换行,元信息+操作按钮换到第二行 */
@media (max-width:640px){
  .row{padding:10px 12px;row-gap:4px;column-gap:8px}
  .row .ic{display:none}
  .row .nm{flex:1 1 100%;white-space:normal;overflow-wrap:anywhere;line-height:1.45;font-size:13px}
  .row .cnt{font-size:10.5px;padding:2px 8px}
  .row .sz{width:auto;text-align:left}
  .row .ops{margin-left:auto}
  .ep-row{padding:10px 12px;row-gap:6px;column-gap:8px}
  .ep-row .emn{flex:1 1 100%;white-space:normal;overflow-wrap:anywhere;line-height:1.5;font-size:12.5px}
  .ep-row .esz{margin-left:auto}
}
.op{font-size:13px;padding:4px 10px;border-radius:7px;text-decoration:none;cursor:pointer;border:none;background:transparent;transition:all .15s}
.op-del{color:#ff5252;background:rgba(255,82,82,.12)}
.op-del:hover{color:#ff6b6b;background:rgba(255,107,107,.22)}
.op-arm{color:#fff!important;background:#e5484d!important;transform:scale(1.06)}
.op:hover{filter:brightness(1.08)}
.fab{position:fixed;right:22px;bottom:96px;width:52px;height:52px;border-radius:50%;background:#58a6ff;color:#fff;font-size:22px;line-height:1;border:none;box-shadow:0 4px 12px rgba(0,0,0,.25);cursor:pointer;z-index:90;display:flex;align-items:center;justify-content:center;transition:transform .15s}
.fab:hover{background:#1557b0;transform:scale(1.06)}
.fab:active{transform:scale(.94)}
.fab.op-arm{background:#c93a3a!important;font-size:12px;font-weight:600}
.divider{height:1px;background:#eef0f3;margin:3px 0}
.empty{text-align:center;color:#999;padding:50px 0;font-size:14px}
#player{position:fixed;inset:0;z-index:99;display:none;align-items:center;justify-content:center;flex-direction:column;padding:20px}
#player .overlay{position:absolute;inset:0;background:rgba(0,0,0,.82)}
#player .frame{position:relative;width:min(960px,96vw);background:#111;border-radius:12px;overflow:hidden}
.vwrap{position:relative;width:100%}
#player .bar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#1a1d23;color:#eee}
#player .bar .pt{flex:1;font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pClose{background:transparent;border:1px solid #f85149;color:#f85149;font-size:15px;width:28px;height:28px;border-radius:50%;line-height:1;cursor:pointer;flex-shrink:0}
#pClose:hover{background:#f85149;color:#fff}
#player .vwrap{position:relative}
#player #artContainer{width:100%;height:min(540px,54vw,72vh);max-height:72vh;background:#000}
#subLoading{position:absolute;left:50%;bottom:12%;transform:translateX(-50%);background:rgba(0,0,0,.72);color:#ffd54f;font-size:15px;padding:10px 18px;border-radius:8px;z-index:900;display:none;pointer-events:none;text-align:center}
#dmBtn{background:#2a3140;color:#eee;border:1px solid #444;border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer}
#dmReBtn{background:#2a3140;color:#eee;border:1px solid #444;border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer}
#dmMatch{position:absolute;top:8px;left:14px;width:min(440px,calc(100% - 28px));background:#1c212b;border:1px solid #3a4250;border-radius:10px;padding:10px;z-index:999;display:none;box-shadow:0 8px 24px rgba(0,0,0,.5)}
#dmMatch .dmRow{display:flex;gap:8px}
#dmMatch .dmRow input{flex:1;min-width:0;box-sizing:border-box;padding:7px 10px;border-radius:6px;border:1px solid #444;background:#14181f;color:#eee;font-size:13px;outline:none}
#dmMatch .dmRow input:focus{border-color:#ffd700}
#dmMatch button{background:#2a3140;color:#eee;border:1px solid #444;border-radius:6px;padding:4px 10px;cursor:pointer;font-size:12px}
#dmMatch button:hover{border-color:#ffd700}
#dmResults{max-height:230px;overflow:auto;margin-top:8px;display:flex;flex-direction:column;gap:4px}
#dmResults .dm-item{padding:8px 10px;border-radius:6px;cursor:pointer;border:1px solid transparent;font-size:13px}
#dmResults .dm-item:hover{background:#2a3140;border-color:#ffd700}
#dmResults .dm-item .c{color:#999;font-size:11px;margin-left:8px}
#dmResults .dm-empty{color:#999;font-size:12px;padding:6px 2px}
#dmResults .dm-item.open{border-color:#ffd700}
#dmResults .dm-pages{margin:4px 0 2px 14px;padding-left:10px;border-left:2px solid #3a4250;display:flex;flex-direction:column;gap:2px;max-height:200px;overflow:auto}
#dmResults .dm-page{padding:5px 8px;border-radius:6px;cursor:pointer;font-size:12px;color:#d6dde6}
#dmResults .dm-page:hover{background:#2a3140;color:#ffd700}
#dmResults .dm-page .c{color:#999;margin-left:6px}
#dmResults .dm-page.cur{background:#2a3140;color:#ffd700;border:1px solid #ffd700}
</style>
</head>
<body>
<div class=crumb id=crumb></div>
<div class=wrap>
  <div class=list id=list></div>
  <div id=animeView style='display:none'></div>
  <div class=empty id=empty style='display:none'>当前目录没有视频</div>
</div>
<button class=fab id=rsBtn title=刷新><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/></svg></button>
<div id=player>
  <div class=overlay onclick=closePlayer()></div>
  <div class=frame>
    <div class=bar><span class=pt id=pTitle></span><button id=dmBtn onclick=toggleDm() title=弹幕>弹幕</button><button id=dmReBtn onclick=openDmMatch() title=重新匹配>重新匹配</button><button id=pClose onclick=closePlayer() title=关闭>✕</button></div>
    <div class=vwrap><div id=artContainer></div><div id=subLoading>解码字幕中(首次约 10-20 秒)...</div>
      <div id=dmMatch>
        <div class=dmRow><input id=dmQ placeholder="输入番名搜索B站..."><button id=dmSearchBtn onclick=dmDoSearch()>搜索</button><button onclick=closeDmMatch()>✕</button></div>
        <div id=dmResults></div>
      </div>
    </div>
  </div>
</div>
<script>
const enc=p=>p.split('/').map(encodeURIComponent).join('/');
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const isVideo=n=>/\.(mp4|mkv|webm|avi|mov|ts|flv|m4v)$/i.test(n);
const fmtSize=s=>s>=1073741824?(s/1073741824).toFixed(1)+' GB':s>=1048576?(s/1048576).toFixed(1)+' MB':s>=1024?(s/1024).toFixed(0)+' KB':s+' B';
let vids=[];
function loadList(){fetch('/videos.json?t='+Date.now()).then(r=>r.json()).then(fs=>{vids=fs;renderAnime();}).catch(()=>document.getElementById('empty').style.display='block');}
loadList();
// ===== 播放器(ArtPlayer + dandanplay 弹幕)=====
let art=null,curUrl='';
function loadSub(url){
  // url 已是 enc() 编码过的(play 传入),直接拼,不能再 encodeURIComponent(否则双层编码 404)
  if(!/\.(mkv|mka|mp4|webm)$/i.test(url)||!art)return;
  fetch('/sub?action=probe&path='+url,{cache:'no-store'})
    .then(r=>r.json()).then(j=>{
      const subs=(j.streams||[]).filter(s=>/subrip|ass|srt|webvtt/i.test(s.codec_name));
      if(!subs.length)return;
      // 覆盖层提示:解码字幕中(字幕轨加载完成后 subtitleLoad 事件隐藏)
      const ov=document.getElementById('subLoading');
      if(ov)ov.style.display='flex';
      const subUrl='/sub?action=get&path='+url+'&i='+subs[0].index;
      const doSwitch=()=>art.subtitle.switch(subUrl,{type:'vtt'});
      if(art.ready&&art.ready.then)art.ready.then(doSwitch);else doSwitch();
    }).catch(()=>{});
}
function hideSubLoading(){const ov=document.getElementById('subLoading');if(ov)ov.style.display='none';}
function createPlayer(url,danmu,opts){
  if(art){art.destroy();art=null;}
  art=new Artplayer(Object.assign({
    container:document.getElementById('artContainer'),
    url:url,
    autoSize:false,aspectRatio:true,fullscreen:true,fullscreenWeb:true,theme:'#ffd700',
    plugins:[artplayerPluginDanmuku({
      danmuku:()=>Promise.resolve(danmu||[]),
      speed:7.5,opacity:0.9,antiOverlap:true,synchronousPlayback:true,visible:true,emitter:false,margin:["37.5%","25%"]
    })]
  },opts||{}));
  art.on('subtitleLoad',hideSubLoading);
  return art;
}
function play(row,url){
  const nm=row.querySelector('.nm').textContent;
  document.getElementById('pTitle').textContent=nm;
  document.getElementById('player').style.display='flex';
  dmList=[];dmTitle='';dmCurEp=0;
  curUrl=url;
  createPlayer('/media/'+url,[],{autoplay:true});
  loadSub(url);
  const p=parseAnime(nm);
  dmTitle=p.title||'';
  if(dmOn&&p.title&&p.title!=='(其他)')loadDm(p.title,p.ep);else dmBtnLabel();
}
function closePlayer(){
  document.getElementById('player').style.display='none';
  if(art){art.destroy();art=null;}
}
// ===== dandanplay 弹幕 =====
let dmOn=true,dmList=[],dmTitle='',dmCurEp=0,dmSource=null;
function dmBtnLabel(st){const b=document.getElementById('dmBtn');b.textContent=st||('弹幕:'+(dmOn?'开':'关')+(dmList.length?('('+dmList.length+')'):''));}
function toDanmu(comments){
  // dandan comment:p="时间,模式,颜色hex,用户hash"(逗号分隔),m=弹幕内容
  return (comments||[]).map(x=>{
    const pp=String(x.p||'').split(',');
    const t=parseFloat(pp[0]);
    const mode=parseInt(pp[1],10);
    const c=String(pp[2]||'').replace('#','');
    return {
      text:String(x.m||''),
      mode:(mode==2?1:mode==3?2:0),
      color:(c&&c!=='0'&&c.length>=6)?('#'+c.slice(0,6)):'#fff',
      time:isNaN(t)?0:t
    };
  }).filter(d=>d.text&&d.time>=0);
}
function rebuildPlayer(){
  if(!art)return;
  const t=art.currentTime,paused=art.paused,url=art.option.url;
  createPlayer(url,dmOn?dmList:[],{autoplay:false});
  art.on('ready',()=>{art.currentTime=t;if(!paused)art.play();});
  if(curUrl)loadSub(curUrl);
}
function toggleDm(){dmOn=!dmOn;dmBtnLabel();rebuildPlayer();}
function openDmMatch(){
  const m=document.getElementById('dmMatch');
  document.getElementById('dmQ').value=dmSearchTitle(dmTitle)||'';
  document.getElementById('dmResults').innerHTML='';
  m.style.display='block';
  document.getElementById('dmQ').focus();
  // 自动搜索并定位到已加载弹幕的视频/分P
  dmDoSearch(true);
}
function closeDmMatch(){document.getElementById('dmMatch').style.display='none';}
function dmDoSearch(auto){
  const q=document.getElementById('dmQ').value.trim();
  const box=document.getElementById('dmResults');
  if(!q){box.innerHTML='<div class=dm-empty>请输入番名</div>';return;}
  box.innerHTML='<div class=dm-empty>搜索中...</div>';
  fetch('/bili?action=search&kw='+encodeURIComponent(q),{cache:'no-store'})
    .then(r=>r.json()).then(j=>{
      const list=(j.data&&j.data.result)||[];
      if(!list.length){box.innerHTML='<div class=dm-empty>无匹配结果,换个名字试试</div>';return;}
      box.innerHTML='';
      const items=[];
      list.slice(0,20).forEach(v=>{
        const t=v.title.replace(/<\/?em[^>]*>/g,'');
        const d=document.createElement('div');d.className='dm-item';
        d.innerHTML='<span>'+esc(t)+'</span><span class=c>'+esc(v.author)+' · '+v.danmaku+'弹</span>';
        d.onclick=()=>dmExpandPages(v,d);
        box.appendChild(d);
        items.push({v,d});
      });
      // auto:自动展开当前弹幕来源的视频并定位分P;无来源则展开第一个(最相关)
      if(auto){
        const hit=dmSource?items.find(x=>x.v.bvid===dmSource.bvid):null;
        if(hit)dmExpandPages(hit.v,hit.d,dmSource.cid);
        else if(items.length)dmExpandPages(items[0].v,items[0].d);
      }
    }).catch(()=>{box.innerHTML='<div class=dm-empty>搜索失败</div>';});
}
// 点击视频 → 展开分P 列表选集(再点收起);highlightCid 时定位并高亮该分P
function dmExpandPages(v,item,highlightCid){
  const sub=item.querySelector('.dm-pages');
  if(sub){sub.remove();item.classList.remove('open');return;}
  item.classList.add('open');
  const box=document.createElement('div');box.className='dm-pages';
  box.innerHTML='<div class=dm-empty>加载分P...</div>';
  item.appendChild(box);
  fetch('/bili?action=pagelist&bvid='+v.bvid,{cache:'no-store'}).then(r=>r.json()).then(j=>{
    const pages=j.data||[];
    if(!pages.length){box.innerHTML='<div class=dm-empty>无分P</div>';return;}
    const cur=(parseAnime(document.getElementById('pTitle').textContent)||{}).ep;
    const idx=matchPart(pages,cur);
    box.innerHTML='';
    pages.forEach((p,i)=>{
      const pd=document.createElement('div');pd.className='dm-page';
      const isCur=highlightCid?(p.cid===highlightCid):(i===idx);
      if(isCur)pd.classList.add('cur');
      pd.innerHTML='<span>'+(i+1)+'P</span><span class=c>'+esc(p.part||'')+(isCur?' ◀ 当前':'')+'</span>';
      pd.onclick=e=>{e.stopPropagation();dmPickPage(v,p);};
      box.appendChild(pd);
      if(isCur)pd.scrollIntoView({block:'nearest'});
    });
  }).catch(()=>{box.innerHTML='<div class=dm-empty>分P 加载失败</div>';});
}
function dmPickPage(v,p){
  dmList=[];dmTitle=v.title.replace(/<\/?em[^>]*>/g,'');
  closeDmMatch();
  dmBtnLabel('B站加载中...');
  fetch('/bili?action=dm&cid='+p.cid,{cache:'no-store'}).then(r=>r.text()).then(xml=>{
    if(!xml||xml.indexOf('<d')<0){dmBtnLabel('无弹幕');setTimeout(dmBtnLabel,6000);return;}
    const doc=new DOMParser().parseFromString(xml,'text/xml');
    const ds=doc.querySelectorAll('d[p]');
    dmList=[];
    ds.forEach(d=>{
      const pp=d.getAttribute('p').split(',');
      const m=+pp[1]||1;const col=+pp[3]||16777215;
      dmList.push({text:d.textContent,mode:(m==4?2:m==5?1:0),color:'#'+col.toString(16).padStart(6,'0'),time:+pp[0]||0});
    });
    dmSource={bvid:v.bvid,cid:p.cid};
    dmBtnLabel('B站:'+dmList.length);
    if(dmOn&&dmList.length)rebuildPlayer();
  }).catch(()=>{dmBtnLabel('加载失败');setTimeout(dmBtnLabel,6000);});
}
function dmShowEps(a){
  const box=document.getElementById('dmResults');
  const eps=a.episodes||[];
  box.innerHTML='';
  const back=document.createElement('div');back.className='dm-empty';back.textContent='‹ 返回搜索';back.style.cursor='pointer';
  back.onclick=()=>{document.getElementById('dmResults').innerHTML='';dmDoSearch();};
  box.appendChild(back);
  const head=document.createElement('div');head.className='dm-item';head.style.cursor='default';head.style.borderColor='#ffd700';
  head.innerHTML='<span>'+esc(a.animeTitle)+'</span>';
  box.appendChild(head);
  eps.forEach((e,i)=>{
    const d=document.createElement('div');d.className='dm-item';
    d.innerHTML='<span>'+(i+1)+' 集</span><span class=c>'+esc(e.episodeTitle||'')+((i+1)===dmCurEp?' ✓':'')+'</span>';
    d.onclick=()=>dmPick(a,i+1);
    box.appendChild(d);
  });
}
function dmPick(a,ep){
  dmList=[];dmTitle=a.animeTitle;dmCurEp=ep||0;
  closeDmMatch();
  dmBtnLabel('匹配中...');
  const eps=a.episodes||[];
  let item=null;
  if(ep)item=eps[Math.min(Math.max(ep-1,0),eps.length-1)];
  if(!item)item=eps[0];
  if(!item){dmBtnLabel();return;}
  fetch('/dandan/api/v2/comment/'+item.episodeId,{cache:'no-store'})
    .then(r=>r.json()).then(j=>{
      dmList=toDanmu(j.comments);
      dmBtnLabel();
      rebuildPlayer();
    }).catch(()=>dmBtnLabel());
}
function loadDm(title,ep){
  dmTitle=title;dmCurEp=ep||undefined;
  dmBtnLabel('B站匹配中...');
  loadBiliDm(title,ep);
}
// 刮削中文名(anm:v8 缓存里的 bgm name)搜索更准;无缓存回落文件名标题
function dmSearchTitle(title){
  try{const c=localStorage.getItem('anm:v8:'+title);if(c){const o=JSON.parse(c);if(o.name)return o.name;}}catch(e){}
  return title;
}
// 分P 匹配:优先按 part 标题里的集数(第X话/EPX/X话),匹配不到按顺序
function matchPart(pages,ep){
  for(let i=0;i<pages.length;i++){
    const t=String(pages[i].part||'');
    if(new RegExp('第\\s*'+ep+'\\s*[话集話]|EP0?'+ep+'|E0?'+ep+'\\b|\\b'+ep+'\\s*[话集話]').test(t))return i;
  }
  return Math.min(Math.max((ep||1)-1,0),pages.length-1);
}
// 从视频拉弹幕:pagelist 解析分P → 匹配集数 → dm(cid) → 转插件格式
function dmFromVideo(v,ep){
  return fetch('/bili?action=pagelist&bvid='+v.bvid,{cache:'no-store'}).then(r=>r.json()).then(j=>{
    const pages=j.data||[];
    if(!pages.length)return null;
    const idx=matchPart(pages,ep);
    const cid=pages[idx]&&pages[idx].cid;
    if(!cid)return null;
    return fetch('/bili?action=dm&cid='+cid,{cache:'no-store'});
  }).then(r=>r&&r.text()).then(xml=>{
    if(!xml||xml.indexOf('<d')<0)return false;
    const doc=new DOMParser().parseFromString(xml,'text/xml');
    const ds=doc.querySelectorAll('d[p]');
    dmList=[];
    ds.forEach(d=>{
      const p=d.getAttribute('p').split(',');
      const m=+p[1]||1;const col=+p[3]||16777215;
      dmList.push({text:d.textContent,mode:(m==4?2:m==5?1:0),color:'#'+col.toString(16).padStart(6,'0'),time:+p[0]||0});
    });
    dmSource={bvid:v.bvid,cid:cid};
    dmBtnLabel('B站:'+dmList.length);
    if(dmOn&&dmList.length)rebuildPlayer();
    return true;
  });
}
function loadBiliDm(title,ep){
  dmBtnLabel('B站匹配中(最长16秒)...');
  fetch('/bili?action=search&kw='+encodeURIComponent(dmSearchTitle(title)),{cache:'no-store'})
    .then(r=>{
      if(!/json/i.test(r.headers.get('content-type')||''))throw new Error('风控拦截');
      return r.json();
    }).then(j=>{
      const list=(j.data&&j.data.result)||[];
      if(!list.length){dmBtnLabel('B站无结果');setTimeout(dmBtnLabel,6000);return;}
      let v=null;
      if(ep){
        const re=new RegExp('第\\s*'+ep+'\\s*[话集話]|E[Pp]?0?'+ep+'|\\b'+ep+'\\b');
        v=list.find(x=>/第.+[话集話]|E[Pp]?\d|SP/i.test(x.title)&&re.test(x.title))||null;
      }
      if(!v)v=list.find(x=>/全集|全\d+[话集話]|合集|全.*话/i.test(x.title))||list[0];
      return dmFromVideo(v,ep);
    }).then(ok=>{
      if(ok===false||ok===null){dmBtnLabel('B站无弹幕,点重新匹配手动选');setTimeout(dmBtnLabel,6000);}
    }).catch(()=>{dmBtnLabel('B站匹配失败,点重新匹配重试');setTimeout(dmBtnLabel,6000);});
}

function parseAnime(name){
  let s=name.replace(/\.[^.]+$/,'');
  s=s.replace(/\([0-9A-Fa-f]{8,}\)\s*$/,'');
  let ep=null;
  const m1=s.match(/S\d{1,2}E(\d{1,2})/i);
  if(m1)ep=+m1[1];
  else{const m2=s.match(/[\[-](\d{1,2})[\])-]/)||s.match(/-\s*(\d{1,2})\s*\[/);if(m2&&+m2[1]>0&&+m2[1]<=99)ep=+m2[1];}
  const parts=s.split(/(\[[^\]]*\])/g).filter(Boolean);
  const outside=parts.filter(p=>!p.startsWith('['));
  const blocks=parts.filter(p=>p.startsWith('[')).map(b=>b.slice(1,-1));
  let kw;
  if(outside.length){
    kw=outside.join(' ');
    kw=kw.replace(/\(([^)]*)\)/g,(mm,inner)=>/CR|WEB|AVC|HEVC|1080|720|480|MKV|MP4|AAC|X26|H26|10BIT|8BIT/i.test(inner)?' ':mm);
  }else{
    const QUAL=/^(webrip|web_dl|web|hdtv|bd|dvd|bluray|hevc|avc|hevc_aac|avc_aac|h264_aac|x264|x265|h264|h265|hevc_10bit|hevc10bit|10bit|1080p|720p|480p|2160p|4k|8bit|aac|flac|opus|av1|av1_opus|gb_cn|gb|cn|chs|cht|jp|sc|tc|sc_tc|chs_cht|chs_jp|cht_jp|chs_cht_jp|简日|繁日|简繁|内嵌|简体内嵌|pgs|ass|sub|v\d+)$/i;
    kw=blocks.slice(1).filter(b=>!QUAL.test(b.replace(/\s/g,''))&&!/^\d{3,4}$/.test(b)&&!/^\d{1,2}$/.test(b)).join(' ');
  }
  kw=kw.replace(/S\d{1,2}E\d{1,2}/i,' ');
  kw=kw.replace(/[-_\s]+\d{1,2}\s*$/,'');
  kw=kw.replace(/^\d{1,2}\s*[-_\s]+/,'');
  kw=kw.replace(/[-_.]{2,}/g,' ').replace(/\s+-\s+/g,' ').replace(/\s+/g,' ').replace(/[\s\-_.]+$/,'').replace(/^[\s\-_.]+/,'').trim();
  if(!kw)kw='(其他)';
  return {title:kw,ep};
}

// 轻量番剧名刮削:bgm 搜索拿中文/官方名(7 天缓存,不取封面)

// 按 bgm id 拉详情+集数,存 localStorage,返回 meta(搜索命中/hint/蜜柑兑底共用)
async function fetchBgmMeta(bgmId,key){
  try{
    const d=await fetch('/bgm/v0/subjects/'+bgmId);
    if(d.ok){const dj=await d.json();
      if(!dj||(!dj.name_cn&&!dj.name))return null; // 无效条目(占位/已删),让调用方走蜜柑兜底
      const name=(dj.name_cn||'').trim()||(dj.name||'').trim();
      const img=(dj.images&&dj.images.medium)?dj.images.medium.replace(/^http:/,'https:').replace(/^https:\/\/lain\.bgm\.tv/,'/lain'):'';
      let score='',eps='',tags=[],updated='';
      score=dj.rating&&dj.rating.score?String(dj.rating.score):'';eps=dj.total_episodes&&dj.total_episodes>0?dj.total_episodes:'';tags=(dj.tags||[]).filter(t=>GENRES.test(t.name)).slice(0,2).map(t=>t.name);
      try{
        const er=await fetch('/bgm/v0/episodes?subject_id='+bgmId+'&limit=100');
        if(er.ok){const ej=await er.json();if(ej.data&&ej.data.length){const d2=new Date();const today=d2.getFullYear()+'-'+String(d2.getMonth()+1).padStart(2,'0')+'-'+String(d2.getDate()).padStart(2,'0');const upd=ej.data.filter(e=>e.airdate&&e.airdate<=today).length;updated=upd>0?upd:'';}}
      }catch(e){}
      const meta={name,img,score,eps,updated,tags,ts:Date.now()};
      try{if(key)localStorage.setItem(key,JSON.stringify(meta));}catch(e){}
      return meta;
    }
  }catch(e){}
  return null;
}
async function getAnimeMeta(title,hint){
  const key='anm:v8:'+title;
  try{const c=localStorage.getItem(key);if(c){const o=JSON.parse(c);if(Date.now()-o.ts<7*864e5)return o;}}catch(e){}
  // 有 mikan 下载索引(bgm id)时直接拉详情,不做文件名搜索匹配
  if(hint&&hint.bgm){const m=await fetchBgmMeta(hint.bgm,key);if(m)return m;}
  const up=title.toUpperCase();
  let alias='';
  for(const k in NAME_ALIAS)if(up===k||up.startsWith(k)){alias=NAME_ALIAS[k];break;}
  const variants=[alias||'',title,title.replace(/_/g,' '),title.replace(/_/g,' ').replace(/\s*S\d{1,2}\s*$/i,'')];
  for(const v of [...new Set(variants)]){
    if(!v)continue;
    try{
      const r=await fetch('/bgm/search/subject/'+encodeURIComponent(v)+'?type=2');
      if(!r.ok)continue;
      const j=await r.json();
      if(j.list&&j.list.length){
        const m=await fetchBgmMeta(j.list[0].id,key);
        if(m)return m;
      }
    }catch(e){}
  }
  // 蜜柑搜索兑底:bgm 搜索对繁简体/书名号不友好(「」直接 404),蜜柑模糊搜索能命中,再经蜜柑详情页拿 bgm id
  try{
    const sr=await fetch('/mikan-p/Home/Search?searchstr='+encodeURIComponent(title));
    if(sr.ok){
      const sh=await sr.text();
      const mm=sh.match(/\/Home\/Bangumi\/(\d+)/);
      if(mm){
        // 从搜索页提取该番封面+番名(与 id 匹配)
        let mkImg='',mkName='';
        try{
          const sd=new DOMParser().parseFromString(sh,'text/html');
          const card=[...sd.querySelectorAll('a[href^="/Home/Bangumi/"]')].find(a=>(a.getAttribute('href')||'').split('/').pop()===mm[1]);
          if(card){const sp=card.querySelector('span[data-src]');if(sp)mkImg=sp.getAttribute('data-src')||'';}
          const at=sd.querySelector('.an-text');
          if(at)mkName=at.getAttribute('title')||at.textContent.trim();
        }catch(e){}
        const dr=await fetch('/mikan-p/Home/Bangumi/'+mm[1]);
        if(dr.ok){
          const dh=await dr.text();
          const bm=dh.match(/bgm\.tv\/subject\/(\d+)/);
          if(bm){const m=await fetchBgmMeta(bm[1],key);if(m)return m;}
        }
        // bgm 链接无效(蜜柑挂的旧链接/条目已删)→ 蜜柑封面+番名兑底(至少出封面)
        const mkUrl=u=>u?u.replace(/^https?:\/\/mikanani\.me/,'/mikan-p').replace(/^\/images\//,'/mikan-p/images/'):'';
        const meta={name:mkName,img:mkUrl(mkImg),score:'',eps:'',updated:'',tags:[],ts:Date.now()};
        try{localStorage.setItem(key,JSON.stringify(meta));}catch(e){}
        return meta;
      }
    }
  }catch(e){}
  return {name:'',img:'',score:'',eps:'',updated:'',tags:[]};
}
function findDlMap(items){
  for(const it of items){
    const n=it.name.split('/').pop();
    try{const c=localStorage.getItem('dlmap:'+n);if(c){const o=JSON.parse(c);if(o.bgm)return o;}}catch(e){}
  }
  return null;
}
function renderAnime(){
  document.getElementById('animeView').style.display='block';
  document.getElementById('list').style.display='none';
  document.getElementById('empty').style.display='none';
  const box=document.getElementById('animeView');
  const groups=new Map();
  vids.forEach(v=>{
    if(!v.name.startsWith('Aria2/')||!isVideo(v.name))return;
    const p=parseAnime(v.name.split('/').pop());
    const key=p.title||'(其他)';
    if(!groups.has(key))groups.set(key,[]);
    groups.get(key).push({ep:p.ep,base:v.name.split('/').pop(),name:v.name,size:v.size});
  });
  if(expandedAnime){
    const items=groups.get(expandedAnime)||[];
    box.innerHTML='';
    const back=document.createElement('button');back.className='back-btn';back.textContent='‹ 返回番剧列表';back.onclick=()=>{expandedAnime=null;renderAnime();};
    box.appendChild(back);
    items.sort((a,b)=>(a.ep||999)-(b.ep||999)).forEach(it=>{
      const r=document.createElement('div');r.className='ep-row';
      r.innerHTML='<span class=epl></span><span class=emn></span><span class=esz></span><span class=ops><button class="op op-del">✕</button></span>';
      r.querySelector('.epl').textContent=it.ep?('第'+it.ep+'集'):'单集';
      r.querySelector('.emn').textContent=it.base;
      r.querySelector('.esz').textContent=fmtSize(it.size);
      const u=enc(it.name);
      r.querySelector('.emn').onclick=e=>{e.stopPropagation();play({querySelector:()=>({textContent:it.base})},u);};
      r.querySelector('.emn').style.cursor='pointer';
      r.querySelector('.op-del').onclick=e=>{e.stopPropagation();delFile(e.currentTarget,it.name);};
      box.appendChild(r);
    });
    return;
  }
  box.innerHTML='';
  const grid=document.createElement('div');grid.className='anime-grid';
  [...groups.keys()].sort((a,b)=>a.localeCompare(b)).forEach(t=>{
    const items=groups.get(t);
    const r=document.createElement('div');r.className='acard';
    r.innerHTML='<div class=aposter><span class=aph>📺</span><span class=tags></span><span class=ms></span><span class=me></span></div><div class=atitle></div>';
    r.querySelector('.atitle').textContent=t;
    r.querySelector('.me').textContent=items.length+' 集';
    r.onclick=()=>{expandedAnime=t;renderAnime();};
    getAnimeMeta(t,findDlMap(items)).then(m=>{
      if(m.name)r.querySelector('.atitle').textContent=m.name;
      if(m.img)r.querySelector('.aph').innerHTML='<img src="'+m.img.replace(/&/g,'&amp;')+'" loading="lazy" onerror="this.parentNode.innerHTML=\'🎬\'">';
      if(m.score)r.querySelector('.ms').textContent='⭐'+m.score;
      if(m.tags&&m.tags.length){const box=r.querySelector('.tags');box.innerHTML='';m.tags.forEach(tg=>{const s=document.createElement('span');s.textContent=tg;box.appendChild(s);});}
      r.querySelector('.me').textContent=items.length+(m.eps?('/'+m.eps):'')+' 集'+(m.updated&&(!m.eps||m.updated!=m.eps)?' ·更至'+m.updated:'');
    });
    grid.appendChild(r);
  });
  box.appendChild(grid);
}
