<div class=crumb id=crumb></div>

  <div class=list id=list></div>

<button class=fab id=rsBtn title=刷新><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/></svg></button>

<script>
const enc=p=>p.split('/').map(encodeURIComponent).join('/');
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const isVideo=n=>/\.(mp4|mkv|webm|avi|mov|ts|flv|m4v)$/i.test(n);
const fmtSize=s=>s>=1073741824?(s/1073741824).toFixed(1)+' GB':s>=1048576?(s/1048576).toFixed(1)+' MB':s>=1024?(s/1024).toFixed(0)+' KB':s+' B';
let vids=[];
function loadList(){fetch('/videos.json?t='+Date.now()).then(r=>r.json()).then(fs=>{vids=fs;renderAnime();}).catch(()=>document.getElementById('empty').style.display='block');}
loadList();
function play(row,url){
  const nm=row.querySelector('.nm').textContent;
  document.getElementById('pTitle').textContent=nm;
  document.getElementById('pv').src='/media/'+url;
  document.getElementById('player').style.display='flex';
}
function closePlayer(){const pv=document.getElementById('pv');pv.pause();pv.src='';document.getElementById('player').style.display='none';}
// 文件名 → 番名+集数(借鉴 AutoBangumi 解析思路:去字幕组块/集数/质量块)
function parseAnime(name){
  let s=name.replace(/\.[^.]+$/,'');
  s=s.replace(/\([0-9A-Fa-f]{8,}\)\s*$/,'');
  let ep=null;
  const m1=s.match(/S\d{1,2}E(\d{1,2})/i);
  if(m1)ep=+m1[1];
  else{const m2=s.match(/[\[-](\d{1,2})[\])-]/)||s.match(/-\s*(\d{1,2})\s*\[/);if(m2&&+m2[1]>0&&+m2[1]<=99)ep=+m2[1];}
  const parts=s.split(/(\[[^\]]*\])/g).filter(Boolean);
  const outside=parts.filter(p=>!p.startsWith('['));
  const blocks=parts.filter(p=>p.startsWith('[')).map(b=>b.slice(1,-1));
  let kw;
  if(outside.length){
    kw=outside.join(' ');
    kw=kw.replace(/\(([^)]*)\)/g,(mm,inner)=>/CR|WEB|AVC|HEVC|1080|720|480|MKV|MP4|AAC|X26|H26|10BIT|8BIT/i.test(inner)?' ':mm);
  }else{
    const QUAL=/^(webrip|web_dl|web|hdtv|bd|dvd|bluray|hevc|avc|hevc_aac|avc_aac|h264_aac|x264|x265|h264|h265|hevc_10bit|hevc10bit|10bit|1080p|720p|480p|2160p|4k|8bit|aac|flac|opus|av1|av1_opus|gb_cn|gb|cn|chs|cht|jp|sc|tc|sc_tc|chs_cht|chs_jp|cht_jp|chs_cht_jp|简日|繁日|简繁|内嵌|简体内嵌|pgs|ass|sub|v\d+)$/i;
    kw=blocks.slice(1).filter(b=>!QUAL.test(b.replace(/\s/g,''))&&!/^\d{3,4}$/.test(b)&&!/^\d{1,2}$/.test(b)).join(' ');
  }
  kw=kw.replace(/S\d{1,2}E\d{1,2}/i,' ');
  kw=kw.replace(/[-_\s]+\d{1,2}\s*$/,'');
  kw=kw.replace(/^\d{1,2}\s*[-_\s]+/,'');
  kw=kw.replace(/[-_.]{2,}/g,' ').replace(/\s+-\s+/g,' ').replace(/\s+/g,' ').replace(/[\s\-_.]+$/,'').replace(/^[\s\-_.]+/,'').trim();
  if(!kw)kw='(其他)';
  return {title:kw,ep};
}
// ==== 番剧视图(按番名分组) ====
let expandedAnime=null;
function copyLink(vp,btn){
  const ta=document.createElement('textarea');
  ta.value=vp;ta.style.position='fixed';ta.style.opacity='0';
  document.body.appendChild(ta);ta.select();
  let ok=false;
  try{ok=document.execCommand('copy');}catch(e){}
  document.body.removeChild(ta);
  const old=btn.textContent;
  btn.textContent=ok?'✓ 已复制':'失败';
  setTimeout(()=>btn.textContent=old,2000);
}
/* 已删除复制链接功能 */
function armDel(btn,fn,msg){
  if(btn.dataset.arm!=='1'){
    btn.dataset.arm='1';
    const old=btn.innerHTML;
    btn.innerHTML=msg||'确认?';
    btn.classList.add('op-arm');
    clearTimeout(btn._t);
    btn._t=setTimeout(()=>{btn.dataset.arm='';btn.innerHTML=old;btn.classList.remove('op-arm');},3000);
    return;
  }
  fn();
}
function refreshAfterDel(){fetch('/rescan',{cache:'no-store'}).then(r=>r.json()).then(j=>{if(j&&j.ok)loadList();}).catch(()=>{});}
const FAB_SVG='<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/></svg>';
document.getElementById('rsBtn').onclick=function(){
  const b=this;
  armDel(b,()=>{
    b.innerHTML='…';
    // 先重扫 videos.json(新下载的文件才会进列表),再清 bgm 缓存重新刮削
    fetch('/rescan',{cache:'no-store'}).then(r=>r.json()).then(j=>{
      let n=0;
      try{const keys=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.indexOf('anm:v8:')===0)keys.push(k);}keys.forEach(k=>localStorage.removeItem(k));n=keys.length;}catch(e){}
      loadList();
      b.innerHTML='✓';
      setTimeout(()=>{b.innerHTML=FAB_SVG;},1600);
    }).catch(()=>{b.innerHTML='!';setTimeout(()=>{b.innerHTML=FAB_SVG;},1600);});
  },'刷新?');
};
function delFile(btn,name){
  armDel(btn,()=>{
    fetch('/del?path='+enc(name)).then(res=>res.json()).then(j=>{
      if(j&&j.ok){
        vids=vids.filter(x=>x.name!==name);
        renderAnime();
        refreshAfterDel();
      }else alert('删除失败: '+(j&&j.error||'未知错误'));
    }).catch(err=>alert('删除失败: '+err));
  });
}
// 轻量番剧名刮削:bgm 搜索拿中文/官方名(7 天缓存,不取封面)
const NAME_ALIAS={
  CONAN:'名侦探柯南',
  'ONAJI ZEMI':'同一个研讨会的染谷同学是AV女优的事',
  TENKOUSAKI:'転校先の清楚可憐な美少女'
};
const GENRES=/^(冒险|恋爱|奇幻|科幻|喜剧|搞笑|日常|校园|悬疑|推理|治愈|致郁|热血|战斗|动作|恐怖|惊悚|剧情|催泪|百合|后宫|魔法|异世界|穿越|重生|机战|机甲|运动|体育|音乐|偶像|美食|侦探|历史|战争|生存|猎奇|黑暗|纯爱|励志|家庭|职场|玄幻|仙侠|武侠|修真|赛博朋克|末日|单元剧|长篇|泡面番|卖肉|子供向|少女向|少年向|青年向|年番|子供番|少儿|兽人|猫娘|伪娘|病娇|腹黑|傲娇|萝莉|正太|萌系|废萌|虐心|多角恋|逆后宫|血腥|智斗|群像|公路片|轮回|时间旅行|太空|宇宙|AI|虚拟世界|游戏|电子游戏|吸血鬼|僵尸|恶魔|天使|忍者|武士|警察|犯罪|刑事|律师|医疗|科学|考古|探险|Action|Adventure|Comedy|Drama|Fantasy|Sci-Fi|Romance|Slice of Life|School|Mystery|Thriller|Horror|Supernatural|Magic|Mecha|Sports|Music|Food|Historical|Psychological|Yuri|BL|Harem|Ecchi|Isekai|Space|Cyberpunk|Detective|Crime|Military|Martial Arts|Ninja|Samurai|Parody|Time Travel|Vampire|Zombie)$/i;

// 按 bgm id 拉详情+集数,存 localStorage,返回 meta(搜索命中/hint/蜜柑兑底共用)
async function fetchBgmMeta(bgmId,key){
  try{
    const d=await fetch('/bgm/v0/subjects/'+bgmId);
    if(d.ok){const dj=await d.json();
      if(!dj||(!dj.name_cn&&!dj.name))return null; // 无效条目(占位/已删),让调用方走蜜柑兜底
      const name=(dj.name_cn||'').trim()||(dj.name||'').trim();
      const img=(dj.images&&dj.images.medium)?dj.images.medium.replace(/^http:/,'https:').replace(/^https:\/\/lain\.bgm\.tv/,'/lain'):'';
      let score='',eps='',tags=[],updated='';
      score=dj.rating&&dj.rating.score?String(dj.rating.score):'';eps=dj.total_episodes&&dj.total_episodes>0?dj.total_episodes:'';tags=(dj.tags||[]).filter(t=>GENRES.test(t.name)).slice(0,2).map(t=>t.name);
      try{
        const er=await fetch('/bgm/v0/episodes?subject_id='+bgmId+'&limit=100');
        if(er.ok){const ej=await er.json();if(ej.data&&ej.data.length){const d2=new Date();const today=d2.getFullYear()+'-'+String(d2.getMonth()+1).padStart(2,'0')+'-'+String(d2.getDate()).padStart(2,'0');const upd=ej.data.filter(e=>e.airdate&&e.airdate<=today).length;updated=upd>0?upd:'';}}
      }catch(e){}
      const meta={name,img,score,eps,updated,tags,ts:Date.now()};
      try{if(key)localStorage.setItem(key,JSON.stringify(meta));}catch(e){}
      return meta;
    }
  }catch(e){}
  return null;
}
async function getAnimeMeta(title,hint){
  const key='anm:v8:'+title;
  try{const c=localStorage.getItem(key);if(c){const o=JSON.parse(c);if(Date.now()-o.ts<7*864e5)return o;}}catch(e){}
  // 有 mikan 下载索引(bgm id)时直接拉详情,不做文件名搜索匹配
  if(hint&&hint.bgm){const m=await fetchBgmMeta(hint.bgm,key);if(m)return m;}
  const up=title.toUpperCase();
  let alias='';
  for(const k in NAME_ALIAS)if(up===k||up.startsWith(k)){alias=NAME_ALIAS[k];break;}
  const variants=[alias||'',title,title.replace(/_/g,' '),title.replace(/_/g,' ').replace(/\s*S\d{1,2}\s*$/i,'')];
  for(const v of [...new Set(variants)]){
    if(!v)continue;
    try{
      const r=await fetch('/bgm/search/subject/'+encodeURIComponent(v)+'?type=2');
      if(!r.ok)continue;
      const j=await r.json();
      if(j.list&&j.list.length){
        const m=await fetchBgmMeta(j.list[0].id,key);
        if(m)return m;
      }
    }catch(e){}
  }
  // 蜜柑搜索兑底:bgm 搜索对繁简体/书名号不友好(「」直接 404),蜜柑模糊搜索能命中,再经蜜柑详情页拿 bgm id
  try{
    const sr=await fetch('/mikan-p/Home/Search?searchstr='+encodeURIComponent(title));
    if(sr.ok){
      const sh=await sr.text();
      const mm=sh.match(/\/Home\/Bangumi\/(\d+)/);
      if(mm){
        // 从搜索页提取该番封面+番名(与 id 匹配)
        let mkImg='',mkName='';
        try{
          const sd=new DOMParser().parseFromString(sh,'text/html');
          const card=[...sd.querySelectorAll('a[href^="/Home/Bangumi/"]')].find(a=>(a.getAttribute('href')||'').split('/').pop()===mm[1]);
          if(card){const sp=card.querySelector('span[data-src]');if(sp)mkImg=sp.getAttribute('data-src')||'';}
          const at=sd.querySelector('.an-text');
          if(at)mkName=at.getAttribute('title')||at.textContent.trim();
        }catch(e){}
        const dr=await fetch('/mikan-p/Home/Bangumi/'+mm[1]);
        if(dr.ok){
          const dh=await dr.text();
          const bm=dh.match(/bgm\.tv\/subject\/(\d+)/);
          if(bm){const m=await fetchBgmMeta(bm[1],key);if(m)return m;}
        }
        // bgm 链接无效(蜜柑挂的旧链接/条目已删)→ 蜜柑封面+番名兑底(至少出封面)
        const mkUrl=u=>u?u.replace(/^https?:\/\/mikanani\.me/,'/mikan-p').replace(/^\/images\//,'/mikan-p/images/'):'';
        const meta={name:mkName,img:mkUrl(mkImg),score:'',eps:'',updated:'',tags:[],ts:Date.now()};
        try{localStorage.setItem(key,JSON.stringify(meta));}catch(e){}
        return meta;
      }
    }
  }catch(e){}
  return {name:'',img:'',score:'',eps:'',updated:'',tags:[]};
}
function findDlMap(items){
  for(const it of items){
    const n=it.name.split('/').pop();
    try{const c=localStorage.getItem('dlmap:'+n);if(c){const o=JSON.parse(c);if(o.bgm)return o;}}catch(e){}
  }
  return null;
}
function renderAnime(){
  document.getElementById('animeView').style.display='block';
  document.getElementById('list').style.display='none';
  document.getElementById('empty').style.display='none';
  const box=document.getElementById('animeView');
  const groups=new Map();
  vids.forEach(v=>{
    if(!v.name.startsWith('Aria2/')||!isVideo(v.name))return;
    const p=parseAnime(v.name.split('/').pop());
    const key=p.title||'(其他)';
    if(!groups.has(key))groups.set(key,[]);
    groups.get(key).push({ep:p.ep,base:v.name.split('/').pop(),name:v.name,size:v.size});
  });
  if(expandedAnime){
    const items=groups.get(expandedAnime)||[];
    box.innerHTML='';
    const back=document.createElement('button');back.className='back-btn';back.textContent='‹ 返回番剧列表';back.onclick=()=>{expandedAnime=null;renderAnime();};
    box.appendChild(back);
    items.sort((a,b)=>(a.ep||999)-(b.ep||999)).forEach(it=>{
      const r=document.createElement('div');r.className='ep-row';
      r.innerHTML='<span class=epl></span><span class=emn></span><span class=esz></span><span class=ops><button class="op op-del">✕</button></span>';
      r.querySelector('.epl').textContent=it.ep?('第'+it.ep+'集'):'单集';
      r.querySelector('.emn').textContent=it.base;
      r.querySelector('.esz').textContent=fmtSize(it.size);
      const u=enc(it.name);
      r.querySelector('.emn').onclick=e=>{e.stopPropagation();play({querySelector:()=>({textContent:it.base})},u);};
      r.querySelector('.emn').style.cursor='pointer';
      r.querySelector('.op-del').onclick=e=>{e.stopPropagation();delFile(e.currentTarget,it.name);};
      box.appendChild(r);
    });
    return;
  }
  box.innerHTML='';
  const grid=document.createElement('div');grid.className='anime-grid';
  [...groups.keys()].sort((a,b)=>a.localeCompare(b)).forEach(t=>{
    const items=groups.get(t);
    const r=document.createElement('div');r.className='acard';
    r.innerHTML='<div class=aposter><span class=aph>📺</span><span class=tags></span><span class=ms></span><span class=me></span></div><div class=atitle></div>';
    r.querySelector('.atitle').textContent=t;
    r.querySelector('.me').textContent=items.length+' 集';
    r.onclick=()=>{expandedAnime=t;renderAnime();};
    getAnimeMeta(t,findDlMap(items)).then(m=>{
      if(m.name)r.querySelector('.atitle').textContent=m.name;
      if(m.img)r.querySelector('.aph').innerHTML='<img src="'+m.img.replace(/&/g,'&amp;')+'" loading="lazy" onerror="this.parentNode.innerHTML=\'🎬\'">';
      if(m.score)r.querySelector('.ms').textContent='⭐'+m.score;
      if(m.tags&&m.tags.length){const box=r.querySelector('.tags');box.innerHTML='';m.tags.forEach(tg=>{const s=document.createElement('span');s.textContent=tg;box.appendChild(s);});}
      r.querySelector('.me').textContent=items.length+(m.eps?('/'+m.eps):'')+' 集'+(m.updated&&(!m.eps||m.updated!=m.eps)?' ·更至'+m.updated:'');
    });
    grid.appendChild(r);
  });
  box.appendChild(grid);
}

</script>
</body>
</html>
