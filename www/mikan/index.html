<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>蜜柑追番</title>
<script>if(window.self===window.top)location.replace('/hub.html?v=mikan');</script>
<style>
:root{--bg:#24292e;--card:#2d333b;--line:#444c56;--tx:#e6edf3;--mut:#8b949e;--acc:#58a6ff;--ok:#2ea043;--err:#f85149}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font:14px/1.5 system-ui,"PingFang SC","Microsoft YaHei",sans-serif;padding-bottom:80px}
header{position:sticky;top:0;z-index:10;background:rgba(36,41,46,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:6px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
h1{font-size:14px;white-space:nowrap}
h1 b{color:var(--acc)}
#seasonSel{background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:7px 10px;font-size:13px;outline:none;max-width:100%}
.sbtn{margin-left:auto;background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:7px 12px;cursor:pointer;font-size:15px;flex-shrink:0;line-height:1}
.sbtn:hover{border-color:var(--acc);color:var(--acc)}
.search-panel{position:fixed;top:48px;left:0;right:0;z-index:30;background:var(--card);border-bottom:1px solid var(--line);box-shadow:0 6px 16px rgba(0,0,0,.35);display:none}
.search-panel.show{display:flex;gap:8px;padding:10px 14px}
.search-panel input{flex:1;background:#1f2428;border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:9px 12px;font-size:14px;outline:none;min-width:0}
.search-panel input:focus{border-color:var(--acc)}
.search-panel button{background:var(--acc);border:none;color:#fff;border-radius:8px;padding:9px 18px;cursor:pointer;font-size:14px;flex-shrink:0}
#stat{font-size:11.5px;color:var(--mut);padding:10px 14px 0}
.list-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 12px;border-bottom:1px solid var(--line)}
.list-head #listTitle{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
#listTitle{font-size:13px;color:var(--mut);word-break:break-all}
.list-x{background:transparent;border:1px solid var(--err);color:var(--err);font-size:16px;width:28px;height:28px;border-radius:50%;line-height:1;cursor:pointer;padding:0;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.list-x:hover{background:var(--err);color:#fff}
#anInfo{padding:10px 14px;border-bottom:1px solid var(--line);font-size:12px;color:var(--mut)}
#anInfo .aitags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
#anInfo .aitags span{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:11px}
#anInfo .aisubs{margin-bottom:6px}
#anInfo .aidesc{line-height:1.55;cursor:pointer;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#anInfo .aidesc.open{display:block;-webkit-line-clamp:unset}
.grp{border-bottom:1px solid var(--line)}
.grp:last-child{border-bottom:none}
.grp-head{display:flex;align-items:center;gap:8px;padding:11px 14px;cursor:pointer;font-size:13px;font-weight:600}
.grp-head .gn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grp-head .gmeta{font-size:11px;color:var(--mut);font-weight:400;white-space:nowrap}
.grp-head .arrow{color:var(--mut);transition:transform .15s}
.grp.open .arrow{transform:rotate(180deg)}
.grp-body{display:none;padding:0 0 6px}
.grp.open .grp-body{display:block}
.grp-row.hevc .dl{background:#ff6d00;color:#fff}
.grp-row{display:flex;gap:10px;align-items:center;padding:8px 14px}
.grp-row .t{flex:1;font-size:12.5px;line-height:1.4;min-width:0}
.grp-row .t>div:first-child{word-break:break-all}
.grp-row .m{font-size:11px;color:var(--mut);margin-top:3px}
.daysec{padding:14px 14px 0}
.dayhead{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.dayhead .day{font-size:15px;font-weight:700}
.dayhead .cnt{font-size:11px;color:var(--mut);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:1px 8px}
.dayhead .today{font-size:10px;color:#fff;background:var(--acc);border-radius:999px;padding:1px 7px}
#grid,#searchGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:12px}
#searchGrid{padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;transition:transform .12s}
.cw{position:relative}
.card .cw{position:relative}
.card.high{box-shadow:0 0 0 2px #ffd700,0 0 10px rgba(255,215,0,.5)}
.card .score{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.6);color:#ffd54f;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;pointer-events:none;z-index:2}
.card .tags{position:absolute;top:6px;left:6px;display:flex;flex-direction:column;align-items:flex-start;gap:3px;pointer-events:none;z-index:2}
.card .tags span{background:rgba(0,0,0,.6);color:#fff;font-size:10px;padding:1px 7px;border-radius:999px}
.card .eps{position:absolute;bottom:6px;left:6px;background:rgba(0,0,0,.55);color:#fff;font-size:10px;padding:2px 7px;border-radius:999px;pointer-events:none;z-index:2}
.card:active{transform:scale(.97)}
.card img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:#30363d}
.card .tt{padding:8px 8px 2px;font-size:12.5px;line-height:1.4;min-height:52px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
#list{display:none;margin:10px 14px 0;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
#listBody{display:flex;flex-direction:column}
.row .t{flex:1;font-size:13px;line-height:1.45;min-width:0}
.row .t>div:first-child{word-break:break-all}
.row .m{font-size:11px;color:var(--mut);margin-top:4px}
.dl{background:var(--ok);border:none;color:#04231a;font-weight:700;border-radius:8px;padding:9px 14px;cursor:pointer;white-space:nowrap;transition:transform .15s,box-shadow .15s}
.dl.dl-done{transform:scale(1.2);box-shadow:0 0 0 3px rgba(255,255,255,.35);background:var(--acc);color:#fff}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1c2126;border:1px solid var(--line);border-radius:10px;padding:10px 18px;font-size:13px;display:none;z-index:99;max-width:90vw}
#toast.ok{border-color:var(--ok)}#toast.err{border-color:var(--err)}
.bili-bar{display:flex;align-items:center;gap:8px;padding:4px 12px;border-bottom:1px solid var(--line);background:rgba(0,0,0,.15)}
.bili-play{background:#00aeec;border:none;border-radius:8px;min-width:40px;height:34px;padding:0 8px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform .15s}
.bili-play:active{transform:scale(.92)}
.bili-bar input{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:7px 10px;font-size:13px;outline:none}
.bili-s{background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:7px 10px;cursor:pointer;font-size:13px;flex-shrink:0}
.bili-s:active{transform:scale(.95)}
#biliResults{padding:0 14px;border-bottom:1px solid var(--line);max-height:300px;overflow:auto}
#biliResults .bitem{padding:8px;border-radius:6px;cursor:pointer;font-size:12.5px;border:1px solid transparent}
#biliResults .bitem:hover{background:rgba(255,255,255,.06)}
#biliResults .bitem.cur{border:2px solid #ffd700;background:rgba(255,215,0,.1)}
#biliResults .bitem .bm{font-size:11px;color:var(--mut);margin-top:3px}
.bili-head{display:flex;align-items:center;gap:8px;padding:8px 14px 0}
.bili-x{background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:6px;padding:2px 9px;cursor:pointer;font-size:12px;flex-shrink:0}
#biliFold{background:#00aeec;border-color:#00aeec;color:#fff;font-weight:700;padding:3px 10px}
#biliArea{padding:0 14px 6px;border-bottom:1px solid var(--line)}
/* 播放器控制条:禁止换行/挤压,弹幕按钮组固定位置 */
.art-controls{flex-wrap:nowrap;white-space:nowrap}
.art-controls-center{flex-shrink:0}
.artplayer-plugin-danmuku{flex-shrink:0;display:flex;align-items:center;gap:2px}
.art-controls-right{flex-shrink:0;margin-left:auto}
</style>
</head>
<body>
<header>
  <h1 onclick="showSeason()" title="返回首页" style="cursor:pointer">蜜柑<b>追番</b></h1>
  <select id="seasonSel" onchange="onSeasonChange()"><option>加载中…</option></select>
  <button class="sbtn" onclick="toggleSearch()" title="搜索番剧">🔍</button>
</header>
<div id="searchPanel" class="search-panel">
  <input id="q" placeholder="输入番剧名~" onkeydown="if(event.key==='Enter')doSearch()">
  <button onclick="doSearch()">搜索</button>
</div>
<div id="stat">加载中…</div>
<div id="season"></div>
<div id="searchGrid" style="display:none"></div>
<div id="list">
  <div class="list-head"><button class="bili-x" id="biliFold" onclick="biliFold()" title="折叠/展开 B 站播放">折叠B站</button><span id="listTitle"></span><button class="list-x" onclick="closeDetail()" title="关闭">✕</button></div>
  <div class="bili-bar" id="biliBar">
    <button class="bili-play" id="biliLogin" onclick="biliLoginClick()" title="B 站登录状态"><span style="color:#fff;font-weight:700;font-size:12px">登录</span></button>
    <input id="bq" placeholder="B站搜索番剧..." onkeydown="if(event.key==='Enter')bSearch()">
    <button class="bili-s" onclick="bSearch()">搜索</button>
    <button class="bili-s" id="biliTg" onclick="biliToggle()" style="display:none">收起</button>
  </div>
  <div id="biliResults" style="display:none"></div>
  <div id="biliArea" style="display:none">
    <div class="bili-head"><span id="biliTitle" style="flex:1;font-size:12px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></span><button class="bili-x" onclick="biliClose()">✕</button></div>
    <div id="biliBox" style="width:100%;aspect-ratio:16/9;background:#000;border-radius:8px"></div>
    <div id="biliPages" style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px"></div>
  </div>
  <div id="anInfo" style="display:none"></div>
  <div id="listBody"></div>
</div>
<div id="toast"></div>
<!-- B 站扫码登录弹窗 -->
<div id="biliLoginModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:99;align-items:center;justify-content:center">
  <div style="background:var(--card);border:1px solid var(--line);border-radius:12px;padding:26px;text-align:center;min-width:300px">
    <h3 style="margin-bottom:14px;color:#ffd700">扫码登录 B 站</h3>
    <div id="biliQr" style="background:#fff;border-radius:8px;padding:10px;display:inline-block;margin-bottom:12px">获取二维码...</div>
    <div id="biliQrSt" style="font-size:12px;color:var(--mut);margin-bottom:14px">打开手机 B 站 App 扫一扫</div>
    <button class="bili-s" onclick="biliLoginClose()">关闭</button>
  </div>
</div>
<script>
const MK='https://mikanani.me';
const PROXY='/mikan-p';
const RPC='/aria2/jsonrpc';
const DAYS={1:'星期一',2:'星期二',3:'星期三',4:'星期四',5:'星期五',6:'星期六',0:'星期日',7:'剧场版'};
let seasonCache=null,seasonList=[],lastQuery='',lastFrom='season',current={year:'',season:''};
let savedScroll=0;  // 进入详情前保存的滚动位置,关闭后恢复
let curBgm=''; // 当前详情页番剧的 bgm id(下载时写索引)

const $=s=>document.querySelector(s);
async function fetchText(u){const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);return r.text();}

// 元数据抓取:蜜柑详情页带 bgm.tv/subject/{id} 链接 → BGM v0 接口(评分/总集数/tags)
// 缓存:localStorage 1 天(已更新集数要新集及时;nginx 层:蜜柑详情 1h、bgm v0 12h 已有);信号量限流 6 并发
const GENRES=/^(冒险|恋爱|奇幻|科幻|喜剧|搞笑|日常|校园|悬疑|推理|治愈|致郁|热血|战斗|动作|恐怖|惊悚|剧情|催泪|百合|后宫|魔法|异世界|穿越|重生|机战|机甲|运动|体育|音乐|偶像|美食|侦探|历史|战争|生存|猎奇|黑暗|纯爱|励志|家庭|职场|玄幻|仙侠|武侠|修真|赛博朋克|末日|单元剧|长篇|泡面番|卖肉|子供向|少女向|少年向|青年向|年番|子供番|少儿|兽人|猫娘|伪娘|病娇|腹黑|傲娇|萝莉|正太|萌系|废萌|虐心|多角恋|逆后宫|血腥|智斗|群像|公路片|轮回|时间旅行|太空|宇宙|AI|虚拟世界|游戏|电子游戏|吸血鬼|僵尸|恶魔|天使|忍者|武士|警察|犯罪|刑事|律师|医疗|科学|考古|探险|Action|Adventure|Comedy|Drama|Fantasy|Sci-Fi|Romance|Slice of Life|School|Mystery|Thriller|Horror|Supernatural|Magic|Mecha|Sports|Music|Food|Historical|Psychological|Yuri|BL|Harem|Ecchi|Isekai|Space|Cyberpunk|Detective|Crime|Military|Martial Arts|Ninja|Samurai|Parody|Time Travel|Vampire|Zombie)$/i;
let scoreQueue=0,scoreMax=6;
function loadMeta(id,card){
  const key='mk:meta8:'+id;
  const apply=m=>{
    if(m.score){card.querySelector('.score').textContent='⭐'+m.score;if(+m.score>=7)card.classList.add('high');}
    if(m.eps||m.updated){const t=m.eps,u=m.updated;card.querySelector('.eps').textContent=(u&&t&&u!=t)?(u+'/'+t+' 集'):((t||u)+' 集');}
    if(m.tags&&m.tags.length){const box=card.querySelector('.tags');box.innerHTML='';m.tags.forEach(t=>{const s=document.createElement('span');s.textContent=t;box.appendChild(s);});}
  };
  // 全空缓存视为无效(刮削失败的空 meta 不信任),直接重新拉
  try{const c=localStorage.getItem(key);if(c){const o=JSON.parse(c);if(Date.now()-o.ts<864e5&&(o.score||o.eps||o.updated||(o.tags&&o.tags.length))){apply(o);return;}}}catch(e){}
  const run=async()=>{
    try{
      const d=await fetchText(PROXY+'/Home/Bangumi/'+id);
      const m=d.match(/bgm\.tv\/subject\/(\d+)/);
      const meta={score:'',eps:'',tags:[]};
      if(m){
        const r=await fetch('/bgm/v0/subjects/'+m[1]);
        if(r.ok){const j=await r.json();meta.score=j.rating&&j.rating.score?String(j.rating.score):'';meta.eps=j.total_episodes&&j.total_episodes>0?j.total_episodes:'';meta.tags=(j.tags||[]).filter(t=>GENRES.test(t.name)).slice(0,2).map(t=>t.name);}
        const er=await fetch('/bgm/v0/episodes?subject_id='+m[1]+'&limit=100');
        if(er.ok){const ej=await er.json();if(ej.data&&ej.data.length){const d=new Date();const today=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');const upd=ej.data.filter(e=>e.airdate&&e.airdate<=today).length;meta.updated=upd>0?upd:'';}}
      }
      // 全空不写缓存(避免刮削失败的空 meta 污染 1 天)
      if(meta.score||meta.eps||meta.tags.length||meta.updated){try{localStorage.setItem(key,JSON.stringify(Object.assign({ts:Date.now()},meta)));}catch(e){}}
      apply(meta);
    }catch(e){}
    scoreQueue--;
  };
  if(scoreQueue<scoreMax){scoreQueue++;run();}
  else setTimeout(()=>loadMeta(id,card),400);
}

// 首次:拉主页提取季度列表 + 当前季度,然后加载星期分组
async function init(){
  try{
    $('#stat').textContent='正在加载…';
    const home=await fetchText(PROXY+'/Home/Bangumi');          // 302 自动跟随(nginx proxy_redirect)
    const doc=new DOMParser().parseFromString(home,'text/html');
    // 季度列表(蜜柑下拉里的 data-year/data-season)
    seasonList=[...doc.querySelectorAll('.date-select a[data-year]')].map(a=>({
      year:a.getAttribute('data-year'),season:a.getAttribute('data-season')}));
    // 当前季度,如 "2026 夏季番组"
    let y=null,s=null;
    const hdr=doc.querySelector('.date-text')||{};
    const m=(hdr.textContent||'').match(/(\d{4})\s*(\S{1,2})季番组/);
    if(m){y=m[1];s=m[2];}
    if(!y&&seasonList.length){y=seasonList[0].year;s=seasonList[0].season;}
    renderSeasonSel();
    $('#seasonSel').value=y+'|'+s;
    await loadSeason(y,s);
  }catch(e){$('#stat').textContent='加载失败: '+e.message;}
  checkBiliLogin();  // 初始化 B 站登录状态按钮
}

function renderSeasonSel(){
  const sel=$('#seasonSel');sel.innerHTML='';
  seasonList.forEach((q,i)=>{
    const o=document.createElement('option');
    o.value=q.year+'|'+q.season;
    o.textContent=q.year+' '+q.season+'季番组';
    sel.appendChild(o);
  });
}

async function onSeasonChange(){
  const [y,s]=$('#seasonSel').value.split('|');
  await loadSeason(y,s);
}

async function loadSeason(year,season){
  current={year:year,season:season};
  try{
    $('#stat').textContent='正在加载 '+year+' '+season+'季番组…';
    const html=await fetchText(PROXY+'/Home/BangumiCoverFlowByDayOfWeek?year='+year+'&seasonStr='+encodeURIComponent(season));
    const doc=new DOMParser().parseFromString(html,'text/html');
    seasonCache=[...doc.querySelectorAll('.sk-bangumi')].map(block=>({
      dow:+block.getAttribute('data-dayofweek'),
      items:[...block.querySelectorAll('li')].map(li=>{
        const a=li.querySelector('a.an-text');
        const img=li.querySelector('span[data-src]');
        const dt=li.querySelector('.date-text');
        const idm=a?a.getAttribute('href').match(/\d+$/):null;
        return {id:idm?idm[0]:'',name:a?(a.getAttribute('title')||a.textContent.trim()):'',
                cover:img?PROXY+img.getAttribute('data-src'):'',
                date:dt?dt.textContent.trim():''};
      }).filter(it=>it.name)   // 过滤蜜柑"此番组下暂无作品"占位卡片
    }));
    renderSeason();
  }catch(e){$('#stat').textContent='加载失败: '+e.message;}
}

function seasonStat(){
  const total=seasonCache.reduce((n,b)=>n+b.items.length,0);
  const label=current.year?current.year+' '+current.season+'季番组':'本季';
  $('#stat').textContent=label+' · '+total+' 部 · 按放送星期分组 · 点卡片查看资源';
}

function renderSeason(){
  // 星期顺序:周一~周日,剧场版最后
  const order=[1,2,3,4,5,6,0,7];
  const today=new Date().getDay();           // JS:0=周日
  seasonStat();
  const root=$('#season');root.innerHTML='';
  order.forEach(dow=>{
    const b=seasonCache.find(x=>x.dow===dow);
    if(!b||!b.items.length)return;
    const sec=document.createElement('div');sec.className='daysec';
    const head=document.createElement('div');head.className='dayhead';
    head.innerHTML='<span class="day">'+DAYS[dow]+'</span><span class="cnt">'+b.items.length+' 部</span>'+(dow===today?'<span class="today">今天</span>':'');
    const grid=document.createElement('div');grid.id='grid';
    b.items.forEach(it=>{
      const c=document.createElement('div');c.className='card';
      c.innerHTML=(it.cover?'<div class="cw"><img loading="lazy" src="'+it.cover+'" alt=""><span class="tags"></span><span class="score"></span><span class="eps"></span></div>':'')+'<div class="tt"></div>';
      c.querySelector('.tt').textContent=it.name;
      c.onclick=()=>doExpand(it.id,it.name,'season');
      grid.appendChild(c);
      if(it.cover&&it.id)loadMeta(it.id,c);
    });
    sec.appendChild(head);sec.appendChild(grid);
    root.appendChild(sec);
  });
}

// 点卡片:按字幕组归档(详情页→组列表→每组 ExpandEpisodeTable 拉全部集数)
async function doExpand(id,name,from){
  blog('doExpand id='+id,'name='+name,'from='+(from||'season'));
  lastFrom=from||'season';
  curName=name;  // B 站直接播放用

    }).filter(g=>g.gid&&g.name);
    const withItems=await Promise.all(groups.map(g=>
      fetchText(PROXY+'/Home/ExpandEpisodeTable?bangumiId='+id+'&subtitleGroupId='+g.gid+'&take=200')
        .then(html=>{
          const d=new DOMParser().parseFromString(html,'text/html');
          return {...g,items:[...d.querySelectorAll('tbody tr')].map(tr=>{
            const a=tr.querySelector('.magnet-link-wrap');
            const mag=tr.querySelector('.js-episode-select');
            const tds=tr.querySelectorAll('td');
            const t=tr.querySelector('a[href^="/Download/"]');
            return {title:a?a.textContent.trim():'',
                    size:tds[2]?tds[2].textContent.trim():'',
                    date:tds[3]?tds[3].textContent.trim():'',
                    magnet:mag?mag.getAttribute('data-magnet'):'',
                    url:t?location.origin+PROXY+t.getAttribute('href'):''};
          }).filter(x=>x.title)};
        }).catch(()=>({...g,items:[]}))
    )).then(gs=>gs.filter(g=>g.items.length));
    $('#listTitle').textContent='「'+name+'」· '+withItems.length+' 个字幕组';
    renderGroups(withItems,name,{info,desc});

}

function renderGroups(groups,name,meta){
  $('#listTitle').textContent='「'+name+'」· '+groups.length+' 个字幕组';

  const l=$('#listBody');l.innerHTML='';

    const head=document.createElement('div');head.className='grp-head';
    head.innerHTML='<span class="gn"></span><span class="gmeta">'+(g.date?'更新 '+g.date:'')+(g.items.length?' · '+g.items.length+' 集':'')+'</span><span class="arrow">▾</span>';
    head.querySelector('.gn').textContent=g.name;
    head.onclick=()=>grp.classList.toggle('open');
    const body=document.createElement('div');body.className='grp-body';
    g.items.forEach(it=>{
      const r=document.createElement('div');r.className='grp-row';
      // HEVC 资源行加底色标注(HEVC-10bit/x265 等)
      if(/HEVC|10BIT|X265|H\.?265/i.test(it.title))r.classList.add('hevc');
      r.innerHTML='<div class="t"><div></div><div class="m">'+(it.size||'')+(it.date?' · '+it.date:'')+'</div></div><button class="dl">⬇</button>';
      r.querySelector('.t>div:first-child').textContent=it.title;
      r.querySelector('.dl').onclick=(ev)=>{
        const b=ev.currentTarget;
        b.classList.add('dl-done');b.textContent='✓';
        clearTimeout(b._t);
        b._t=setTimeout(()=>{b.classList.remove('dl-done');b.textContent='⬇';},3000);
        aria2Add(it.url||it.magnet,it.title);

        try{localStorage.setItem('dlmap:'+it.title,JSON.stringify({bgm:curBgm||'',ts:Date.now()}));}catch(e){}
      };
      body.appendChild(r);
    });

    l.appendChild(grp);
  });

function renderInfo(meta){
  const ai=$('#anInfo');
  if(meta&&meta.info){
    const tags=[];
    if(meta.info.day)tags.push('放送:'+meta.info.day);
    if(meta.info.ep)tags.push('共'+meta.info.ep+'集');
    if(meta.info.start)tags.push('开始:'+meta.info.start);
    const prefix=tags.length?('📅 '+tags.join(' · ')+'\n\n'):'';
    let html='';
    if(meta.desc)html+='<div class="aidesc"></div>';
    ai.innerHTML=html;
    if(meta.desc||prefix){

async function aria2Add(url,label){
  if(!url){toast('❌ 该条目无下载链接','err');return;}
  let u=url;
  if(u.startsWith(MK))u=u.replace(MK,location.origin+PROXY);   // torrent 直链改走本地反代,aria2 不解析蜜柑域名
  const body={jsonrpc:'2.0',id:Date.now(),method:'aria2.addUri',params:[[u]]};
  try{
    const r=await fetch(RPC,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const j=await r.json();
    if(j.error)throw new Error(j.error.message);
    toast('✅ 已加入 aria2:'+(label||'').slice(0,42)+'…','ok');
  }catch(e){toast('❌ 加入失败: '+e.message,'err');}
}

// 智能匹配:核心串匹配 + 4字窗口兼容变体/简称,合集/第1话优先,滤 OP/解说;播放/弹幕高权重
// 同音异字归一:菈→拉(「再见菈菈」vs「再见拉拉」),否则变体项全被滤掉只剩严格同名项
function biliPick(list){
  const clean=t=>t.replace(/<\/?em[^>]*>/g,'');
  const strip=s=>s.replace(/[^\u4e00-\u9fa5]/g,'').replace(/[篇季話话集]/g,'').replace(/[菈]/g,'拉');
  const k=strip(curName||'');
  const wins=[];
  for(let i=0;i+4<=k.length;i++)wins.push(k.slice(i,i+4));
  let best=null,bs=-1;
  (list||[]).forEach(x=>{
    const t=clean(x.title),t2=strip(t);
    if(!t2.includes(k)&&!(wins.length&&wins.some(w=>t2.includes(w))))return;  // 完整或4字窗口匹配(兼容"菈菈/拉拉"变体)
    let s=50;
    if(/全\d+[话集話]|全集|合集|\d+\s*[-~—～]\s*\d+\s*[集话話]/.test(t))s+=100;
    if(/第\s*1\s*[话集話]|第0?1话|[\[(]0?1[\]）)]/.test(t))s+=30;
    if(/SP|预告|OP|ED|MAD|解说|杂谈|吐槽|盘点|剪辑|纯音乐|NCOP|NCED|主题曲|名场面|歌词/.test(t))s-=70;
    s+=Math.log10((x.play||0)+10)*22;    // 播放量权重(高)
    s+=Math.log10((x.danmaku||0)+10)*15;  // 弹幕量权重(高)
    if(s>bs){bs=s;best=x;}
  });
  return best||(list||[])[0];
}
async function biliPlay(){
  const name=curName;
  blog('biliPlay name='+name);
  if(!name){toast('未获取到番剧名','err');return;}
  $('#biliTitle').textContent='B 站搜索:'+name;
  $('#biliArea').style.display='block';
  try{await ensureBili();blog('脚本加载完成');}catch(e){blog('脚本加载失败 '+e.message);toast(e.message,'err');return;}
  try{
    // 搜索词变体:全名 → 去"第X季/季" → 去空格(全名常触发风控,短名更稳)
    const variants=[name, name.replace(/\s*第?[一二三四五六七八九十百\d]+\s*季\s*$/,'').trim(), name.replace(/\s+/g,'')];
    let list=[],lastErr='';
    for(const kw of variants){
      if(!kw)continue;
      blog('搜索变体 kw='+kw);
      const r=await fetch('/bili?action=search&kw='+encodeURIComponent(kw),{cache:'no-store'});
      const ct=r.headers.get('content-type')||'';
      const txt=await r.text();
      blog('http='+r.status,'ct='+ct,'body='+txt.length+'B');
      if(txt.trim()){
        try{
          const j=JSON.parse(txt);
          list=(j.data&&j.data.result)||[];
          if(list.length){blog('命中 kw='+kw,'结果数='+list.length);break;}
        }catch(e){lastErr='JSON 解析失败:'+e.message;}
      }else{lastErr='空响应(风控)';}
    }
    if(!list.length){blog('全部变体失败 lastErr='+lastErr);throw new Error(lastErr||'搜索返回空,稍后重试');}
    const v=biliPick(list);
    curBvid=v.bvid;
    blog('biliPlay 选中='+v.title.replace(/<\/?em[^>]*>/g,''),'bvid='+v.bvid);
    $('#biliTitle').textContent='B 站:'+v.title.replace(/<\/?em[^>]*>/g,'').slice(0,55);
    renderBiliResults(list,true);  // 渲染结果列表,默认收起(展开按钮显示)
    biliPlayVideo(v,1,null);
  }catch(e){blog('biliPlay 失败 ='+e.message);toast('B 站播放失败: '+e.message,'err');}
}
async function biliPlayVideo(v,page,cid){
  blog('biliPlayVideo bvid='+v.bvid,'page='+(page||1),'cid='+(cid||''));
  $('#biliArea').style.display='block';  // 关闭过播放器后,再点结果要重新显示
  $('#biliTitle').textContent='B 站:'+(v.title||'').replace(/<\/?em[^>]*>/g,'').slice(0,55);  // 跟随实际选择
  page=page||1;
  let c=cid;
  if(!c){
    try{
      const r=await fetch('/bili?action=pagelist&bvid='+v.bvid,{cache:'no-store'});
      const j=await r.json();
      const pages=j.data||[];
      blog('pagelist pages='+pages.length);
      biliRenderPages(v,pages);
      if(!pages.length)throw new Error('无分P');
      c=pages[Math.min(page-1,pages.length-1)].cid;
    }catch(e){blog('分P失败 ='+e.message);toast('分P加载失败: '+e.message,'err');return;}
  }
  blog('cid='+c,'拉弹幕');
  let danmu=[];
  try{
    const x=await (await fetch('/bili?action=dm&cid='+c,{cache:'no-store'})).text();
    danmu=[...x.matchAll(/<d p="([^"]*)">([^<]*)<\/d>/g)].map(m=>{
      const a=m[1].split(',');
      const color=a[3]&&a[3]!=='16777215'?'#'+(+a[3]).toString(16).padStart(6,'0'):'#fff';
      return {time:+a[0]||0,text:m[2],color,mode:a[1]==4?1:a[1]==5?2:0};
    });
    blog('弹幕='+danmu.length+' 条');
  }catch(e){blog('弹幕失败 ='+e.message);}
  if(biliArt){biliArt.destroy();biliArt=null;}
  blog('创建 ArtPlayer url=/bili-stream2?bvid='+v.bvid+'&cid='+c);
  biliArt=new Artplayer({
    container:$('#biliBox'),
    url:'/bili-stream2?bvid='+v.bvid+'&cid='+c,
    autoplay:false,autoSize:true,fullscreen:true,fullscreenWeb:true,theme:'#ffd700',  // 自动加载,暂停待用户点击
    plugins:[artplayerPluginDanmuku({danmuku:()=>Promise.resolve(danmu),speed:8,opacity:.9,margin:[10,'75%'],antiOverlap:true,synchronousPlayback:true,visible:true,emitter:false})]
  });
  biliArt.on('ready',()=>{
    blog('播放器 ready,duration='+biliArt.duration);
    // 弹幕按钮组(开关/设置)移到控制条最右(全屏按钮左侧)
    setTimeout(()=>{
      try{
        const dm=biliArt.$('.artplayer-plugin-danmuku');
        const right=biliArt.$('.art-controls-right');
        if(dm&&right&&!right.contains(dm))right.insertBefore(dm,right.firstChild);
      }catch(e){}
    },120);
  });
  biliArt.on('error',e=>{blog('播放错误 ='+(e&&e.message||e));toast('播放错误: '+((e&&e.message)||'未知'),'err');});
}
function biliRenderPages(v,pages){
  const box=$('#biliPages');box.innerHTML='';
  pages.forEach((p,i)=>{
    const b=document.createElement('button');
    b.textContent=(i+1)+' '+(p.part||'');
    b.style.cssText='padding:5px 12px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:#d6dde6;font-size:12px;cursor:pointer';
    b.onclick=()=>{[...box.children].forEach(x=>x.style.borderColor='var(--line)');b.style.borderColor='#ffd700';biliPlayVideo(v,i+1,p.cid);};
    box.appendChild(b);
  });
}

init();
</script>
</body>
</html>
