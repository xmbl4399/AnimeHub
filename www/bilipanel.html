<!DOCTYPE html><html lang=zh><head><meta charset=utf-8><title>B站弹幕播放面板测试</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#1c212b;color:#e6edf3;font-family:system-ui,sans-serif;padding:16px}
.box{background:#242a36;border:1px solid #33405a;border-radius:10px;padding:14px;margin-bottom:14px}
h2{font-size:15px;margin-bottom:10px;color:#ffd700}
.row{display:flex;gap:8px;margin-bottom:10px}
.row input{flex:1;padding:8px 12px;border-radius:6px;border:1px solid #445;background:#14181f;color:#eee;font-size:14px}
button{background:#2a3140;color:#eee;border:1px solid #445;border-radius:6px;padding:7px 14px;cursor:pointer;font-size:13px}
button:hover{border-color:#ffd700;color:#ffd700}
#results{display:flex;flex-direction:column;gap:8px;max-height:400px;overflow:auto}
.vitem{display:flex;gap:10px;padding:8px;border-radius:8px;cursor:pointer;border:1px solid transparent;align-items:center}
.vitem:hover{background:#2a3140;border-color:#ffd700}
.vitem img{width:120px;height:68px;object-fit:cover;border-radius:6px;flex-shrink:0;background:#333}
.vitem .info{flex:1;min-width:0}
.vitem .t{font-size:13px;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vitem .m{font-size:11px;color:#9aa4b2;display:flex;gap:12px;flex-wrap:wrap}
.vitem .m b{color:#ffd54f;font-weight:600}
#playerArea{display:none}
#biliFrame{width:100%;aspect-ratio:16/9;border:none;border-radius:8px;background:#000}
#pages{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.page-btn{padding:5px 12px;border-radius:6px;border:1px solid #445;background:#242a36;color:#d6dde6;font-size:12px;cursor:pointer}
.page-btn:hover{border-color:#ffd700}
.page-btn.cur{background:#ffd700;color:#111;border-color:#ffd700;font-weight:700}
#st{color:#9aa4b2;font-size:12px;margin-bottom:8px}
</style>
</head><body>
<div class=box>
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
    <h2 style="margin-bottom:0">B 站弹幕播放面板</h2>
    <div style="display:flex;align-items:center;gap:8px">
      <span id=loginSt style="font-size:12px;color:#9aa4b2">检查登录...</span>
      <button id=loginBtn onclick=openLogin() style="display:none">扫码登录</button>
      <button id=logoutBtn onclick=doLogout() style="display:none">退出</button>
    </div>
  </div>
  <div class=row><input id=q placeholder="输入番名搜索B站..." onkeydown="if(event.key==='Enter')doSearch()"><button onclick=doSearch()>搜索</button><button id=tgBtn onclick=toggleResults()>收起</button></div>
  <div id=results></div>
</div>
<div class=box id=playerArea>
  <h2 id=pTitle>播放器</h2>
  <div id=artBox style="width:100%;aspect-ratio:16/9;background:#000;border-radius:8px"></div>
  <div id=st></div>
  <div id=pages></div>
</div>
<!-- 扫码登录弹窗 -->
<div id=loginModal style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:99;align-items:center;justify-content:center">
  <div style="background:#242a36;border:1px solid #445;border-radius:12px;padding:26px;text-align:center;min-width:300px">
    <h3 style="margin-bottom:14px;color:#ffd700">扫码登录 B 站</h3>
    <div id=qrBox style="background:#fff;border-radius:8px;padding:10px;display:inline-block;margin-bottom:12px">获取二维码...</div>
    <div id=qrSt style="font-size:12px;color:#9aa4b2;margin-bottom:14px">打开手机 B 站 App 扫一扫</div>
    <button onclick=closeLogin()>关闭</button>
  </div>
</div>
<script src="/lib/artplayer.js"></script>
<script src="/lib/artplayer-plugin-danmuku.js"></script>
<script src="/lib/qrcode.js"></script>
<script>
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
function fmt(n){if(n>=10000)return (n/10000).toFixed(1)+'万';return n;}
// ===== 登录状态 / 扫码登录 =====
let pollTimer=null;
function checkLogin(){
  const st=document.getElementById('loginSt'),lb=document.getElementById('loginBtn'),ob=document.getElementById('logoutBtn');
  fetch('/bili?action=login_status',{cache:'no-store'}).then(r=>r.json()).then(j=>{
    const d=j.data||{};
    if(d.isLogin){st.textContent='已登录:'+(d.uname||'')+'('+d.mid+')';lb.style.display='none';ob.style.display='inline-block';}
    else{st.textContent='未登录(游客)';lb.style.display='inline-block';ob.style.display='none';}
  }).catch(()=>{st.textContent='状态未知';lb.style.display='inline-block';ob.style.display='none';});
}
function openLogin(){
  document.getElementById('loginModal').style.display='flex';
  document.getElementById('qrBox').textContent='获取二维码...';
  document.getElementById('qrSt').textContent='打开手机 B 站 App 扫一扫';
  fetch('/bili?action=qrcode_gen',{cache:'no-store'}).then(r=>r.json()).then(j=>{
    const d=j.data||{};
    if(!d.qrcode_key)throw new Error('无二维码');
    const qr=qrcode(0,'M');qr.addData(d.url);qr.make();
    document.getElementById('qrBox').innerHTML=qr.createImgTag(4);
    pollLogin(d.qrcode_key);
  }).catch(e=>{document.getElementById('qrSt').textContent='获取二维码失败:'+e.message;});
}
function pollLogin(key){
  if(pollTimer)clearInterval(pollTimer);
  const t0=Date.now();
  pollTimer=setInterval(()=>{
    if(Date.now()-t0>90000){
      clearInterval(pollTimer);pollTimer=null;
      document.getElementById('qrSt').textContent='二维码已过期,请关闭后重新打开';
      return;
    }
    fetch('/bili?action=qrcode_poll&qrcode_key='+key,{cache:'no-store'}).then(r=>r.json()).then(j=>{
      const c=j.data?j.data.code:j.code;
      if(c===0){
        clearInterval(pollTimer);pollTimer=null;
        document.getElementById('qrSt').textContent='✅ 登录成功!';
        checkLogin();
        setTimeout(closeLogin,1200);
      }else if(c===86090){
        document.getElementById('qrSt').textContent='✅ 已扫码,请在手机上确认';
      }else{
        document.getElementById('qrSt').textContent='⏳ 等待扫码...';
      }
    }).catch(()=>{});
  },2000);
}
function closeLogin(){if(pollTimer)clearInterval(pollTimer);pollTimer=null;document.getElementById('loginModal').style.display='none';}
function doLogout(){
  fetch('/bili?action=logout',{cache:'no-store'}).then(()=>checkLogin()).catch(()=>checkLogin());
}
checkLogin();
// 支持 ?kw= 参数:模拟从 mikan 卡片点击打开,自动搜索番剧名
(function(){
  const p=new URLSearchParams(location.search);
  const kw=p.get('kw');
  if(kw){
    document.getElementById('q').value=kw;
    L('URL 参数 kw =',kw);
    doSearch();
  }
})();
function doSearch(){
  const q=document.getElementById('q').value.trim();
  const box=document.getElementById('results');
  if(!q)return;
  box.innerHTML='<div class=st>搜索中...</div>';
  box.style.display='block';  // 重新搜索时恢复列表
  document.getElementById('tgBtn').textContent='收起';
  fetch('/bili?action=search&kw='+encodeURIComponent(q),{cache:'no-store'})
    .then(r=>{if(!/json/i.test(r.headers.get('content-type')||''))throw new Error('风控');return r.json();})
    .then(j=>{
      const list=(j.data&&j.data.result)||[];
      if(!list.length){box.innerHTML='<div class=st>无结果(风控或确实无)</div>';return;}
      box.innerHTML='';
      list.slice(0,15).forEach(v=>{
        const d=document.createElement('div');d.className='vitem';
        const pic=v.pic?('https:'+v.pic):'';
        const t=v.title.replace(/<\/?em[^>]*>/g,'');
        const isCollection=/全\d+[话集話]|全集|合集|1-\d/.test(t);
        d.innerHTML='<div class=info><div class=t>'+esc(t)+'</div>'+
          '<div class=m><span>▶ '+fmt(v.play)+'</span><span>弹 <b>'+fmt(v.danmaku)+'</b></span><span>⏱ '+esc(v.duration)+'</span><span>'+esc(v.author)+'</span>'+(isCollection?'<span style="color:#ffd700">合集</span>':'')+'</div></div>';
        d.onclick=()=>openPlayer(v);
        box.appendChild(d);
      });
    }).catch(e=>{box.innerHTML='<div class=st>搜索失败: '+esc(e.message)+'</div>';});
}
// ===== 自播播放器(ArtPlayer + B站流)=====
let biliArt=null;
function L(){const a=['[BILI]'].concat([].slice.call(arguments));console.log.apply(console,a);}
function probeStream(u){
  L('PROBE 开始',u);
  fetch(u,{headers:{Range:'bytes=0-1023'},cache:'no-store'}).then(async r=>{
    const ct=r.headers.get('content-type')||'?';
    const cl=r.headers.get('content-length')||'?';
    const cr=r.headers.get('content-range')||'?';
    const buf=await r.arrayBuffer();
    let hex='';
    const b=new Uint8Array(buf);
    for(let i=0;i<Math.min(16,b.length);i++)hex+=((b[i]||0)).toString(16).padStart(2,'0')+' ';
    L('PROBE status='+r.status,'type='+ct,'len='+cl,'range='+cr,'body='+buf.byteLength+'B','head16='+hex);
  }).catch(e=>L('PROBE error =',e.message));
}
function makePlayer(u,danmu){
  if(biliArt){biliArt.destroy();biliArt=null;}
  L('创建 ArtPlayer,url =',u,'弹幕 =',danmu.length);
  biliArt=new Artplayer({
    container:document.getElementById('artBox'),
    url:u,
    autoplay:true,
    autoSize:true,
    fullscreen:true,
    fullscreenWeb:true,
    theme:'#ffd700',
    plugins:[artplayerPluginDanmuku({danmuku:()=>Promise.resolve(danmu),speed:8,opacity:.9,margin:[10,'75%'],antiOverlap:true,synchronousPlayback:true,visible:true,emitter:false})]
  });
  biliArt.on('ready',()=>{
    L('ArtPlayer ready,duration =',biliArt.duration);
    document.getElementById('st').style.display='none';  // 成功播放:隐藏状态栏
  });
  biliArt.on('error',(e)=>L('ArtPlayer error =',(e&&e.message)||e));
  ['loadedmetadata','canplay','playing','waiting','stalled','suspend','emptied','abort','error'].forEach(ev=>{
    biliArt.on('video:'+ev,(e)=>{
      const v=biliArt.video;
      L('EVT video:'+ev,'rs='+v.readyState,'ns='+v.networkState,ev==='error'?(v.error?('code='+v.error.code+' msg='+v.error.message):'no error obj'):'');
    });
  });
}
function fetchDm(cid){
  return fetch('/bili?action=dm&cid='+cid,{cache:'no-store'}).then(r=>r.text()).then(xml=>{
    const m=[...xml.matchAll(/<d p="([^"]*)">([^<]*)<\/d>/g)];
    L('弹幕条数 =',m.length);
    return m.map(x=>{
      const a=x[1].split(',');
      const color=a[3]&&a[3]!=='16777215'?'#'+(+a[3]).toString(16).padStart(6,'0'):'#fff';
      return {time:+a[0]||0,text:x[2],color:color,mode:a[1]==4?1:a[1]==5?2:0};
    });
  });
}
function playBili(v,page,cid){
  L('playBili',v.bvid,'page',page,'cid',cid||'');
  document.getElementById('playerArea').style.display='block';
  document.getElementById('pTitle').textContent=v.title.replace(/<\/?em[^>]*>/g,'');
  document.getElementById('st').style.display='block';
document.getElementById('st').textContent='获取播放地址...';
  const pl=cid?Promise.resolve(cid):fetch('/bili?action=pagelist&bvid='+v.bvid,{cache:'no-store'}).then(r=>r.json()).then(j=>{
    const pages=j.data||[];
    L('pagelist pages =',pages.length);
    if(!pages.length)throw new Error('无分P');
    renderPages(v,pages,page);
    return pages[Math.min(page-1,pages.length-1)].cid;
  });
  pl.then(c=>{
    L('cid =',c);
    document.getElementById('st').style.display='block';
document.getElementById('st').textContent='获取播放流(stream)...';
    const u='/bili-stream2?bvid='+v.bvid+'&cid='+c;
    L('stream url =',u);
    probeStream(u);
    // 先拉弹幕再创建播放器,弹幕用插件配置方式注入(不依赖插件实例 API)
    return fetchDm(c).then(dm=>{
      L('弹幕就绪,创建播放器');
      makePlayer(u,dm);
    }).catch(e=>{
      L('弹幕失败,仍播放视频:',e.message);
      makePlayer(u,[]);
    });
  }).catch(e=>{
    L('ERROR =',e.message);
    const st=document.getElementById('st');
    st.style.display='block';
    st.textContent='播放失败:'+e.message;
  });
}
function renderPages(v,pages,cur){
  const box=document.getElementById('pages');
  box.innerHTML='';
  document.getElementById('st').style.display='block';
document.getElementById('st').textContent='共 '+pages.length+' 个分P,点击切换';
  pages.forEach((p,i)=>{
    const b=document.createElement('button');b.className='page-btn'+(i+1===cur?' cur':'');
    b.textContent=(i+1)+' '+(p.part||'');
    b.onclick=()=>{box.querySelectorAll('.page-btn').forEach(x=>x.classList.remove('cur'));b.classList.add('cur');playBili(v,i+1,p.cid);};
    box.appendChild(b);
  });
}
function toggleResults(){
  const box=document.getElementById('results'),btn=document.getElementById('tgBtn');
  const hidden=box.style.display==='none';
  box.style.display=hidden?'block':'none';
  btn.textContent=hidden?'收起':'展开';
}
function openPlayer(v){
  document.getElementById('results').style.display='none';  // 点选后折叠列表
  document.getElementById('tgBtn').textContent='展开';
  playBili(v,1,null);
}
</script>
</body></html>
