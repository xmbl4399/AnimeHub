<!DOCTYPE html><html lang=zh><head><meta charset=utf-8><title>B站弹幕播放面板测试</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#1c212b;color:#e6edf3;font-family:system-ui,sans-serif;padding:16px}
.box{background:#242a36;border:1px solid #33405a;border-radius:10px;padding:14px;margin-bottom:14px}
h2{font-size:15px;margin-bottom:10px;color:#ffd700}
.row{display:flex;gap:8px;margin-bottom:10px}
.row input{flex:1;padding:8px 12px;border-radius:6px;border:1px solid #445;background:#14181f;color:#eee;font-size:14px}
button{background:#2a3140;color:#eee;border:1px solid #445;border-radius:6px;padding:7px 14px;cursor:pointer;font-size:13px}
button:hover{border-color:#ffd700;color:#ffd700}
#results{display:flex;flex-direction:column;gap:8px;max-height:400px;overflow:auto}
.vitem{display:flex;gap:10px;padding:8px;border-radius:8px;cursor:pointer;border:1px solid transparent;align-items:center}
.vitem:hover{background:#2a3140;border-color:#ffd700}
.vitem img{width:120px;height:68px;object-fit:cover;border-radius:6px;flex-shrink:0;background:#333}
.vitem .info{flex:1;min-width:0}
.vitem .t{font-size:13px;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vitem .m{font-size:11px;color:#9aa4b2;display:flex;gap:12px;flex-wrap:wrap}
.vitem .m b{color:#ffd54f;font-weight:600}
#playerArea{display:none}
#biliFrame{width:100%;aspect-ratio:16/9;border:none;border-radius:8px;background:#000}
#pages{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.page-btn{padding:5px 12px;border-radius:6px;border:1px solid #445;background:#242a36;color:#d6dde6;font-size:12px;cursor:pointer}
.page-btn:hover{border-color:#ffd700}
.page-btn.cur{background:#ffd700;color:#111;border-color:#ffd700;font-weight:700}
#st{color:#9aa4b2;font-size:12px;margin-bottom:8px}
</style>
</head><body>
<div class=box>
  <h2>B 站弹幕播放面板(测试)</h2>
  <div class=row><input id=q placeholder="输入番名搜索B站..."><button onclick=doSearch()>搜索</button></div>
  <div id=results></div>
</div>
<div class=box id=playerArea>
  <h2 id=pTitle>播放器</h2>
  <iframe id=biliFrame src=""></iframe>
  <div id=st></div>
  <div id=pages></div>
</div>
<script>
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
function fmt(n){if(n>=10000)return (n/10000).toFixed(1)+'万';return n;}
function doSearch(){
  const q=document.getElementById('q').value.trim();
  const box=document.getElementById('results');
  if(!q)return;
  box.innerHTML='<div class=st>搜索中...</div>';
  fetch('/bili?action=search&kw='+encodeURIComponent(q),{cache:'no-store'})
    .then(r=>{if(!/json/i.test(r.headers.get('content-type')||''))throw new Error('风控');return r.json();})
    .then(j=>{
      const list=(j.data&&j.data.result)||[];
      if(!list.length){box.innerHTML='<div class=st>无结果(风控或确实无)</div>';return;}
      box.innerHTML='';
      list.slice(0,15).forEach(v=>{
        const d=document.createElement('div');d.className='vitem';
        const pic=v.pic?('https:'+v.pic):'';
        const t=v.title.replace(/<\/?em[^>]*>/g,'');
        const isCollection=/全\d+[话集話]|全集|合集|1-\d/.test(t);
        d.innerHTML='<img src="'+esc(pic)+'" loading=lazy>'+
          '<div class=info><div class=t>'+esc(t)+'</div>'+
          '<div class=m><span>▶ '+fmt(v.play)+'</span><span>弹 <b>'+fmt(v.danmaku)+'</b></span><span>⏱ '+esc(v.duration)+'</span><span>'+esc(v.author)+'</span>'+(isCollection?'<span style="color:#ffd700">合集</span>':'')+'</div></div>';
        d.onclick=()=>openPlayer(v);
        box.appendChild(d);
      });
    }).catch(e=>{box.innerHTML='<div class=st>搜索失败: '+esc(e.message)+'</div>';});
}
function openPlayer(v){
  const pa=document.getElementById('playerArea');
  pa.style.display='block';
  document.getElementById('pTitle').textContent=v.title.replace(/<\/?em[^>]*>/g,'');
  const fr=document.getElementById('biliFrame');
  fr.src='https://player.bilibili.com/player.html?bvid='+v.bvid+'&page=1&danmaku=1';
  document.getElementById('st').textContent='加载分P...';
  loadPages(v);
}
function loadPages(v){
  const box=document.getElementById('pages');
  fetch('/bili?action=pagelist&bvid='+v.bvid,{cache:'no-store'})
    .then(r=>r.json()).then(j=>{
      const pages=j.data||[];
      if(!pages.length){box.innerHTML='';document.getElementById('st').textContent='无分P';return;}
      document.getElementById('st').textContent='共 '+pages.length+' 个分P,点击切换';
      box.innerHTML='';
      pages.forEach((p,i)=>{
        const b=document.createElement('button');b.className='page-btn'+(i===0?' cur':'');
        b.textContent=(i+1)+' '+(p.part||'');
        b.onclick=()=>{
          document.getElementById('biliFrame').src='https://player.bilibili.com/player.html?bvid='+v.bvid+'&page='+(i+1)+'&danmaku=1';
          box.querySelectorAll('.page-btn').forEach(x=>x.classList.remove('cur'));
          b.classList.add('cur');
        };
        box.appendChild(b);
      });
    }).catch(()=>{document.getElementById('st').textContent='分P加载失败';});
}
</script>
</body></html>
