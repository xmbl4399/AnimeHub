<!DOCTYPE html><html lang=zh><head><meta charset=utf-8><title>弹幕匹配流程测试</title>
</head><body style="background:#222;color:#eee;font:12px/1.6 monospace;margin:0;padding:12px">
<div id=log style="white-space:pre-wrap;max-height:92vh;overflow:auto;border:1px solid #444;padding:10px"></div>
<script>
var L=function(){var s=[].map.call(arguments,function(x){return (typeof x==='object'&&x!==null)?(function(){try{return JSON.stringify(x);}catch(e){return String(x);}})():String(x);}).join(' ');console.log('[DMFLOW]',s);var d=document.getElementById('log');d.textContent+='\n'+s;d.scrollTop=d.scrollHeight;};
// parseAnime:与 anime.html 同款(测试页复制)
function parseAnime(name){
  var s=name.replace(/\.[^.]+$/,'');
  s=s.replace(/\([0-9A-Fa-f]{8,}\)\s*$/,'');
  var ep=null;
  var m1=s.match(/S\d{1,2}E(\d{1,2})/i);
  if(m1)ep=+m1[1];
  else{var m2=s.match(/[\[-](\d{1,2})[\])-]/)||s.match(/-\s*(\d{1,2})\s*\[/);if(m2&&+m2[1]>0&&+m2[1]<=99)ep=+m2[1];}
  var parts=s.split(/(\[[^\]]*\])/g).filter(Boolean);
  var outside=parts.filter(function(p){return p.charAt(0)!=='[';});
  var blocks=parts.filter(function(p){return p.charAt(0)==='[';}).map(function(b){return b.slice(1,-1);});
  var kw;
  if(outside.length){
    kw=outside.join(' ');
    kw=kw.replace(/\(([^)]*)\)/g,function(mm,inner){return /CR|WEB|AVC|HEVC|1080|720|480|MKV|MP4|AAC|X26|H26|10BIT|8BIT/i.test(inner)?' ':mm;});
  }else{
    var QUAL=/^(webrip|web_dl|web|hdtv|bd|dvd|bluray|hevc|avc|hevc_aac|avc_aac|h264_aac|x264|x265|h264|h265|hevc_10bit|hevc10bit|10bit|1080p|720p|480p|2160p|4k|8bit|aac|flac|opus|av1|av1_opus|gb_cn|gb|cn|chs|cht|jp|sc|tc|sc_tc|chs_cht|chs_jp|cht_jp|chs_cht_jp|简日|繁日|简繁|内嵌|简体内嵌|pgs|ass|sub|v\d+)$/i;
    kw=blocks.slice(1).filter(function(b){return !QUAL.test(b.replace(/\s/g,''))&&!/^\d{3,4}$/.test(b)&&!/^\d{1,2}$/.test(b);}).join(' ');
  }
  kw=kw.replace(/S\d{1,2}E\d{1,2}/i,' ');
  kw=kw.replace(/[-_\s]+\d{1,2}\s*$/,'');
  kw=kw.replace(/^\d{1,2}\s*[-_\s]+/,'');
  kw=kw.replace(/[-_.]{2,}/g,' ').replace(/\s+-\s+/g,' ').replace(/\s+/g,' ').replace(/[\s\-_.]+$/,'').replace(/^[\s\-_.]+/,'').trim();
  if(!kw)kw='(其他)';
  return {title:kw,ep:ep};
}
async function run(){
  L('===== 弹幕匹配完整流程测试 =====');
  L('时间:',new Date().toLocaleTimeString());
  // ① 取第一个视频(模拟播放)
  var fs;
  try{fs=await (await fetch('/videos.json?t='+Date.now())).json();}catch(e){L('① videos.json 失败:',e.message);return;}
  var v=fs.find(function(x){return /\.(mkv|mp4|webm)$/i.test(x.name);});
  if(!v){L('① 没有视频');return;}
  L('① 测试视频:',v.name);
  // ② 模拟 parseAnime(与 anime 页同款:剥离组名/集数/质量块)
  var nm=v.name.split('/').pop();
  var title=parseAnime(nm).title||nm;
  L('② 提取标题(parseAnime):',title);
  // ②a 打印 anm:v8 缓存 key(诊断为什么拿不到中文名)
  var keys=[];
  try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf('anm:v8:')===0)keys.push(k);}}catch(e){}
  L('②a anm:v8 缓存条数:',keys.length,keys.slice(0,8).map(function(k){return k.slice(7);}).join(' | '));
  // ②b 模拟 dmSearchTitle:查 anm:v8 缓存拿 bgm 中文名(与 anime 页同源,直接读)
  var searchKw=title;
  try{
    var c=localStorage.getItem('anm:v8:'+title);
    if(c){var o=JSON.parse(c);if(o.name){searchKw=o.name;L('②b bgm中文名(anm:v8缓存):',searchKw);}}
  }catch(e){}
  if(searchKw===title)L('②b 无bgm缓存,回落文件名标题搜索');
  // ③ 搜索(模拟 loadBiliDm 第一步,用中文名)
  var t0=performance.now();
  var sj;
  try{
    var sr=await fetch('/bili?action=search&kw='+encodeURIComponent(searchKw),{cache:'no-store'});
    var ct=sr.headers.get('content-type')||'';
    L('③ 搜索响应:HTTP '+sr.status,'content-type='+ct,'耗时='+Math.round(performance.now()-t0)+'ms');
    sj=await sr.json();
  }catch(e){L('③ 搜索失败(风控/网络):',e.message,'耗时='+Math.round(performance.now()-t0)+'ms');return;}
  var list=(sj.data&&sj.data.result)||[];
  L('③ 搜索:code='+sj.code,'结果数='+list.length);
  if(!list.length){L('④ 无搜索结果(风控拦截或确实无结果),结束');return;}
  var hit=list[0];
  L('④ 候选视频:',hit.bvid,'|',hit.title.replace(/<\/?em[^>]*>/g,'').slice(0,50),'|',hit.author,'|',hit.danmaku+'弹');
  // ⑤ pagelist(模拟 dmFromVideo)
  t0=performance.now();
  var pl;
  try{pl=await (await fetch('/bili?action=pagelist&bvid='+hit.bvid,{cache:'no-store'})).json();}catch(e){L('⑤ pagelist 失败:',e.message);return;}
  L('⑤ pagelist:',Math.round(performance.now()-t0)+'ms','分P数='+((pl.data||[]).length));
  var pages=pl.data||[];
  if(!pages.length){L('⑤ 无分P,结束');return;}
  L('⑥ 前3分P: '+pages.slice(0,3).map(function(p){return p.cid+'('+p.part+')';}).join(' | '));
  // ⑦ dm 弹幕
  t0=performance.now();
  var dmx;
  try{dmx=await (await fetch('/bili?action=dm&cid='+pages[0].cid,{cache:'no-store'})).text();}catch(e){L('⑦ 弹幕失败:',e.message);return;}
  var n=(dmx.match(/<d p=/g)||[]).length;
  L('⑦ 弹幕(分P1):',Math.round(performance.now()-t0)+'ms','条数='+n);
  if(n){var m=dmx.match(/<d p="[^"]*"[^>]*>[^<]*<\/d>/);L('⑧ 首条弹幕:',m?m[0].slice(0,90):'解析失败');}
  L('===== 流程完成,复制日志给我 =====');
}
run();
</script>
</body></html>
